/* 試合の状態と流れの店。分割前の app.js にあった G と、その G だけを読み書きする関数を引き取った。
   分割前からある項目は名前も初期値も 1 つも変えない（E2E が __TDT.G の項目を直接読むため）。
   Vue の reactive は関数と型付き配列を包まないので、G.rng の関数と G.pending.rec の中身は今までどおり扱える。
   DOM は触らない。例外は 2 つだけで、どちらも理由をその場に書いた。
   1 つは applyMood の body[data-mood]（根 #app の外にあり、どの部品からも届かない）。
   もう 1 つは debugSeed の location.search（ページの入口の値で、画面ではない）。 */
(function(){
'use strict';

var TD=window.TD;
var TDX=window.TDX||(window.TDX={});
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

TV.defineStore('game',function(){
  return TV.reactive({
    schemaVersion:1,
    rulesId:TD.RULES_ID,
    strategyId:TD.STRATEGY_ID,
    matchSeed:'',
    phase:'loading',
    active:'user',
    round:1,
    players:null,
    turn:null,
    stats:null,
    rng:null,
    first:'user',
    fast:false,
    kommyQuiet:false,
    chatOpen:false,
    lastPraise:-1,
    busy:false,
    pending:null,
    resultShown:false,
    gameId:0,
    fortune:false,
    mode:'tutor',
    mood:'normal',
    /* ふたりで対戦の最初だけ、ジャンケンの促しをプレイヤー1 が振るまで吹き出しに残す（仕様書 21.4）。 */
    jankenPending:false,
    adviceLog:[],
    /* 振る演出のコマ。{ダイスの番号:面} か null。views/Dice.js だけが読む。 */
    anim:null,
    /* 助言の枠の中身。{chip,l1,reason,early,onFix,onKeep} か null。views/AdvicePanel.js が読む。 */
    advice:null,
  });
});

/* 店は名前で 1 つだけ作られる。この先の関数はすべてこの G を読み書きする。 */
var G=TV.useStore('game');
/* 飾りの店はこのファイルの後に読み込まれるので、初めて必要になったときに取る。 */
var _ui=null;
function ui(){return _ui||(_ui=TV.useStore('ui'));}

var CAT_SPEECH=TDX.text.CAT_SPEECH;
var makeRng=TDX.rng.makeRng;
var randomSeed=TDX.rng.randomSeed;
var rint=TDX.rng.rint;

/* 台詞と記録は store/tutor.js、待ちと手番の進行は store/director.js、チャットは store/chat.js にある。
   どれもこのファイルより後に読み込まれるので、店は定義の時ではなく呼ぶときに取る。 */
function tutor(){return TV.useStore('tutor');}
function say(l1,l2,chip,tone,kind,extra){tutor().say(l1,l2,chip,tone,kind,extra);}
function clearAdviceLog(){tutor().clearAdviceLog();}
function wait(ms){return TV.useStore('director').wait(ms);}
/* 音の店もこのファイルより後に読み込まれる。鳴らしてよいか（ふたりで対戦だけ）は音の店が決める。 */
function sound(){return TV.useStore('sound');}
function players(){return TDX.viewmodel.players;}
function label(side){return players().playerLabel(G.mode,side);}
/* いまの手番を人が操作するか（仕様書 21.1 の isHumanTurn）。 */
function isHumanTurn(){return G.phase==='playing'&&players().isHumanSide(G.mode,G.active);}
function kommyTurn(){return TV.useStore('director').kommyTurn();}
function closeChat(){TV.useStore('chat').closeChat();}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- 盤面の値 ---------------- */
function newPlayer(){
  return {
    availableMask:255,
    categoryScores:[null,null,null,null,null,null,null,null],
    upperRaw:0,
    bonusAwarded:false,
    total:0,
  };
}
function recompute(p){
  let sum=0;
  let up=0;
  for(let c=0;c<8;c++){
    const v=p.categoryScores[c];
    if(v==null)continue;
    sum+=v;
    if(c<5)up+=v;
  }
  p.upperRaw=up;
  p.bonusAwarded=up>=55;
  p.total=sum+(p.bonusAwarded?40:0);
  let mask=0;
  for(let c=0;c<8;c++)if(p.categoryScores[c]==null)mask|=1<<c;
  p.availableMask=mask;
  if(p.total>268)throw new Error('invariant: total>268');
  const used=8-TD.popcount(mask);
  if(used>8)throw new Error('invariant: used>8');
}
function stateOf(p){return{mask:p.availableMask,upperRaw:p.upperRaw,total:p.total};}
function me(){return G.players.user;}
function ko(){return G.players.kommy;}
function actP(){return G.players[G.active];}
function oppP(){return G.players[G.active==='user'?'kommy':'user'];}
function redCounts(){
  const r=[0,0,0,0,0,0];
  for(const f of G.turn.redFaces)r[f-1]++;
  return r;
}
function handScores(){return TD.scoreFromFaces(G.turn.redFaces,G.turn.green);}
function rerollsLeft(){return 3-G.turn.rollNumber;}
function usedCount(p){return 8-TD.popcount(p.availableMask);}
function bestCat(p,sc){
  let b=-1;
  let bv=-1;
  for(let c=0;c<8;c++)if(p.categoryScores[c]==null&&sc[c]>bv){bv=sc[c];b=c;}
  return b;
}
function applyScore(p,cat,pts){
  if(p.categoryScores[cat]!=null)throw new Error('category already used');
  p.categoryScores[cat]=pts;
  recompute(p);
}

/* 状態だけから決まる述語。DOM も描画も知らないので、部品からも店からも呼べる。 */
/* アリスのうらない：通常操作と解説表示を分ける。canFortune は公開互換の合成述語。 */
function canUserFortune(){
  var t=G.turn;
  if(G.mode==='serious'||!isHumanTurn())return false;
  return !!t&&t.rollNumber>0&&t.rollNumber<3&&!G.busy&&!G.pending;
}
function canExplanationFortune(){
  var c=ui().state.fortuneContext;
  return G.mode!=='serious'&&G.phase==='playing'&&!!c&&c.source!=='user';
}
function canFortune(){return canUserFortune()||canExplanationFortune();}
/* 記録の候補を選べるか。候補のボタンと #btnRegister が出る条件で、Enter の記録もこれで決まる。 */
function canSelect(){
  var t=G.turn;
  if(!G.players||G.fortune)return false;
  if(!isHumanTurn()||G.busy||G.pending)return false;
  return !!(t&&t.rollNumber>0);
}
/* 既定の表情。ガチ対戦の試合中と結果では怒り顔に戻す（tone つきの happy/oops/sad とチャットの think/talk が優先）。 */
function baseExpr(){
  if(G.mode==='serious'&&(G.phase==='playing'||G.phase==='result'))return 'angry';
  /* ふたりで対戦のコミーは進行役なので、プレイヤー2 の番でも考え顔にしない */
  if(G.mode==='pvp')return 'normal';
  return G.active==='kommy'&&G.phase==='playing'?'think':'normal';
}

/* ---------------- 演出の合図 ---------------- */
/* 役がそろったときの文。出すのは store/ui.js で、描くのは views/Fanfare.js である。 */
function fanfare(sc){
  let msg=null;
  let se=null;
  if(sc[7]===70){msg='ボーナスヨット！';se='se_bonus_yacht';}
  else if(sc[7]===50){msg='ヨット！';se='se_yacht';}
  else if(sc[6]>0){msg='L ストレート！';se='se_hand';}
  else if(sc[5]>0){msg='フルハウス！';se='se_hand';}
  if(!msg)return;
  ui().fanfare(msg);
  sound().play(se);
}
/* 記録した枡を光らせる。ここは印を置くだけで、.flash を付けるのは views/Scorecard.js である。 */
function flashRow(who,cat){
  ui().state.flash={who:who,cat:cat,seq:ui().state.flash.seq+1};
}
function clearExplanationDisplay(){
  ui().state.fortuneContext=null;
  ui().state.explanationPaused=false;
  ui().state.scoreBreakdowns=null;
}

/* ---------------- 試合の流れ ---------------- */
function newMatch(seed,mode){
  if(mode)G.mode=mode;
  G.gameId++;
  G.matchSeed=seed||randomSeed();
  G.rng={dice:makeRng(G.matchSeed,'dice'),pres:makeRng(G.matchSeed,'presentation'),chat:makeRng(G.matchSeed,'chat')};
  G.players={user:newPlayer(),kommy:newPlayer()};
  G.round=1;
  G.stats={decisions:0,correct:0,advised:0};
  G.phase='playing';
  G.fast=false;
  G.kommyQuiet=false;
  G.pending=null;
  G.busy=false;
  G.resultShown=false;
  G.selCat=null;
  G.koSel=null;
  G.fortune=false;
  clearExplanationDisplay();
  /* ふたりで対戦の先手はプレイヤー1 で固定し、抽選しない（ダイスの乱数も引かない。決定 Q15） */
  G.first=G.mode==='pvp'?'user':(G.rng.dice()<0.5?'user':'kommy');
  G.active=G.first;
  clearAdviceLog();
  G.anim=null;
  G.advice=null;
  G.mood='normal';
  G.jankenPending=G.mode==='pvp';
  applyMood();
  if(G.mode==='pvp'){
    say('ジャンケンで勝ったほうが先手にゃ。','勝った人がプレイヤー1にゃ。','','','info');
  }else{
    say(G.first==='user'?'あなたが先手にゃ。':'コミーが先手にゃ。','', '', '','info');
    ui().toast(G.first==='user'?'あなたが先手':'コミーが先手');
  }
  G.turn=null;
  const gid=G.gameId;
  setTimeout(()=>{
    if(gid!==G.gameId||G.phase!=='playing')return;
    sound().startBgm();
    startTurn();
  },1000);
}
function startTurn(){
  G.turn={rollNumber:0,redFaces:[1,1,1,1],green:1,held:[false,false,false,false,false],pendingAdvice:null};
  G.selCat=null;
  G.koSel=null;
  G.pending=null;
  G.busy=false;
  G.fortune=false;
  clearExplanationDisplay();
  G.anim=null;
  G.advice=null;
  if(!isHumanTurn()){
    kommyTurn();
    return;
  }
  if(G.mode==='pvp'){
    sound().play(G.active==='user'?'se_turn_p1':'se_turn_p2');
    /* 最初の手番はジャンケンの促しを残す。促しはプレイヤー1 が振ったときに手番の台詞へ替わる（doRoll） */
    if(!G.jankenPending)say(`${label(G.active)}の番にゃ。`,'','','','turn');
  }else{
    say('さあ、どうするにゃ？','','','','turn');
  }
  /* #btnRoll は部品が描くので、無効の解除が済む次の描画を待ってから焦点を移す（移すのは views/App.js）。 */
  ui().focusLater('#btnRoll');
}
function drawRoll(){
  /* 出目は演出より先に決める。 */
  const t=G.turn;
  const which=[];
  for(let i=0;i<5;i++)if(t.rollNumber===0||!t.held[i])which.push(i);
  const res={};
  for(const i of which)res[i]=rint(G.rng.dice,1,6);
  return res;
}
async function doRoll(){
  const gid=G.gameId;
  const t=G.turn;
  const res=drawRoll();
  t.rollNumber++;
  G.busy=true;
  G.fortune=false;
  clearExplanationDisplay();
  const idx=Object.keys(res).map(Number);
  if(G.jankenPending){
    G.jankenPending=false;
    say(`${label(G.active)}の番にゃ。`,'','','','turn');
  }
  if(idx.length)sound().play('se_roll');
  /* 演出のコマは店に置くだけで、描くのは views/Dice.js である */
  if(idx.length&&!REDUCED){
    const t0=performance.now();
    while(performance.now()-t0<650){
      const anim={};
      for(const i of idx)anim[i]=rint(G.rng.pres,1,6);
      G.anim=anim;
      await sleep(80);
      if(gid!==G.gameId){G.anim=null;return false;}
    }
  }
  G.anim=null;
  for(const i of idx){
    if(i===4)t.green=res[i];
    else t.redFaces[i]=res[i];
  }
  if(t.rollNumber===3)for(let i=0;i<5;i++)t.held[i]=false;
  G.busy=false;
  const sc=handScores();
  fanfare(sc);
  if(isHumanTurn())G.selCat=bestCat(actP(),sc);
  return true;
}
async function registerAndAdvance(cat){
  const gid=G.gameId;
  const p=actP();
  const sc=handScores();
  const before=p.total;
  const hadBonus=p.bonusAwarded;
  applyScore(p,cat,sc[cat]);
  sound().play(p.bonusAwarded&&!hadBonus?'se_bonus':sc[cat]===0?'se_zero':'se_register');
  if(G.mode==='pvp')say(`${label(G.active)}は ${CAT_SPEECH[cat]}に ${sc[cat]} 点にゃ`,'','','','register');
  G.turn=null;
  G.pending=null;
  G.selCat=null;
  G.koSel=null;
  flashRow(G.active,cat);
  if(p.total!==before)ui().toast(`${label(G.active)}：${CAT_SPEECH[cat]} に ${sc[cat]} 点（合計 ${p.total}）`);
  const bothDone=usedCount(me())===8&&usedCount(ko())===8;
  if(usedCount(me())===usedCount(ko()))G.round=usedCount(me())+1;
  if(bothDone){
    await wait(900);
    if(gid!==G.gameId)return;
    showResult();
    return;
  }
  G.active=G.active==='user'?'kommy':'user';
  await wait(700);
  if(gid!==G.gameId)return;
  if(G.phase==='playing')startTurn();
}

/* ---------------- 結果 ---------------- */
/* 見出し・点・札・統計の行・共有ボタン・役の表はすべて views/ResultModal.js が G から描く。
   ここに残るのは phase の切り替えと台詞と、窓を開くことだけである。 */
function showResult(){
  G.phase='result';
  G.turn=null;
  G.fortune=false;
  clearExplanationDisplay();
  const a=me().total;
  const b=ko().total;
  /* 前の試合の共有の枠を畳んでおく */
  ui().state.share.boxVisible=false;
  ui().state.share.box='';
  if(G.mode==='pvp'){
    /* コミーは進行役なので、どちらが勝っても喜ぶ */
    const line=a===b?'引き分けにゃ。いい勝負だったにゃ。':`${label(a>b?'user':'kommy')}の勝ちにゃ！おめでとうにゃ。`;
    say(line,'','',a===b?'':'ok','result',{me:a,ko:b});
  }else{
    const line=a>b?'負けたにゃ……教主、強いにゃ。':a<b?'コミーの勝ちにゃ。次はもっと粘るにゃ。':'引き分けにゃ。';
    say(line,'','',a>b?'sad':a<b?'ok':'','result',{me:a,ko:b});
  }
  G.resultShown=true;
  applyMood();
  ui().openModal('ovResult');
  sound().stopBgm();
  sound().play(a===b?'jingle_draw':'jingle_win');
}

/* ---------------- タイトルと気分 ---------------- */
/* 進行中の試合を捨ててタイトルへ戻る（結果画面の「タイトルへ戻る」と ⟳ の「やり直す」で共用） */
function backToTitle(){
  if(G.chatOpen)closeChat();
  sound().stopAll();
  clearAdviceLog();
  G.gameId++;
  G.jankenPending=false;
  G.turn=null;
  G.pending=null;
  G.busy=false;
  G.fortune=false;
  clearExplanationDisplay();
  G.fast=false;
  G.kommyQuiet=false;
  G.anim=null;
  G.advice=null;
  G.phase='title';
  G.mood='normal';
  applyMood();
  /* タイトルは部品が描くので、隠れていた画面が出てから焦点を移す（移すのは views/App.js）。 */
  ui().focusLater('#btnStart');
}
/* 背景の気分：タイトルは気分で、試合と結果はモードで決まる（怒り＝紫、ごきげん・ふたりで対戦＝黄）。
   body[data-mood] は根 #app の外にあって部品の描画が届かないので、店が DOM を触る 2 つの例外の 1 つとする。 */
function moodAttr(){
  if(G.phase==='title')return G.mood==='angry'||G.mood==='pleased'?G.mood:'';
  if(G.phase==='playing'||G.phase==='result'){
    if(G.mode==='serious')return 'angry';
    if(G.mode==='pvp')return 'pleased';
  }
  return '';
}
function applyMood(){
  const mood=moodAttr();
  if(mood)document.body.dataset.mood=mood;
  else delete document.body.dataset.mood;
}

/* ---------------- 勝利の共有 ---------------- */
function shareText(a){
  return `${a}点でコミーにヨットで勝ちました\nhttps://takeshisue1108.github.io/torika_yacht_school/\n#トリッカル`;
}
function shareWin(){
  const text=shareText(me().total);
  /* タブは同期的に開く（コピーの非同期を待つと遮断するブラウザがある） */
  try{window.open('https://x.com/intent/post?text='+encodeURIComponent(text),'_blank','noopener');}catch(e){}
  let pr=null;
  try{pr=navigator.clipboard&&navigator.clipboard.writeText(text);}catch(e){pr=null;}
  if(pr&&typeof pr.then==='function')pr.then(()=>ui().toast('クリップボードに点数をコピーしました'),()=>shareFallback(text));
  else shareFallback(text);
}
/* 枠の表示は views/ResultModal.js が state.share から描き、焦点と選択も同じ部品が seq を見て行う。 */
function shareFallback(text){
  ui().state.share.box=text;
  ui().state.share.boxVisible=true;
  ui().state.share.seq++;
  ui().toast('コピーできませんでした。文を長押しして手動でコピーしてください');
}

/* ---------------- デバッグ ---------------- */
/* URL の ?seed=。ページの入口の値であって画面ではないので、店が DOM の外の窓口を読む 2 つ目の例外とする。 */
function debugSeed(){
  try{
    const s=new URLSearchParams(location.search).get('seed');
    return s&&/^[0-9a-zA-Z_-]{1,64}$/.test(s)?s:null;
  }catch(e){return null;}
}

TDX.game={
  canFortune:canFortune,
  canUserFortune:canUserFortune,
  canExplanationFortune:canExplanationFortune,
  canSelect:canSelect,
  isHumanTurn:isHumanTurn,
  baseExpr:baseExpr,
  newPlayer:newPlayer,
  recompute:recompute,
  stateOf:stateOf,
  me:me,
  ko:ko,
  actP:actP,
  oppP:oppP,
  redCounts:redCounts,
  handScores:handScores,
  rerollsLeft:rerollsLeft,
  usedCount:usedCount,
  bestCat:bestCat,
  applyScore:applyScore,
  fanfare:fanfare,
  flashRow:flashRow,
  newMatch:newMatch,
  startTurn:startTurn,
  drawRoll:drawRoll,
  doRoll:doRoll,
  registerAndAdvance:registerAndAdvance,
  showResult:showResult,
  backToTitle:backToTitle,
  applyMood:applyMood,
  shareText:shareText,
  shareWin:shareWin,
  shareFallback:shareFallback,
  debugSeed:debugSeed,
};
})();

/* ==== js/store/ui.js ==== */
/* 画面の飾りの店。トースト・ファンファーレ・コミーの吹き出しと表情を持ち、DOM は知らない。
   表示は views/Toast.js・views/Fanfare.js・views/KommyRow.js が状態から描く。
   seq は同じ文字列を続けて出したときにも演出を出し直すための番号である（Fanfare が :key に使う）。 */
(function(){
'use strict';

var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

TV.defineStore('ui',function(){
  var s=TV.reactive({
    toast:{text:'',show:false,seq:0},
    fanfare:{text:'',show:false,seq:0},
    /* コミーの吹き出し。open は理由（2 行目）を開いているかで、seq は同じ台詞を言い直したときの番号である。 */
    bubble:{l1:'',l2:'',chip:'',tone:'',open:false,seq:0},
    /* 盤面の立ち絵の表情。normal / happy / oops / sad / angry / think / talk のどれか。 */
    expr:'normal',
    /* 読み込みの進捗。pct は帯の幅の百分率で、msg はその下の文である。 */
    loading:{pct:0,msg:'コミーが最善手の表を作っています…'},
    /* 読み込みに失敗したときの文。 */
    error:{msg:''},
    /* 開いている窓の積み。{id,opener} で、後ろほど手前にある。 */
    modals:[],
    /* 勝利の共有。コピーできなかったときだけ枠を見せて文を入れる。seq は焦点を当て直すための番号である。 */
    share:{box:'',boxVisible:false,seq:0},
    /* 記録した枡の光り。views/Scorecard.js が該当の枡へ .flash を付ける。 */
    flash:{who:'',cat:-1,seq:0},
    /* うらないの開閉の演出。views/Scorecard.js が seq を見て .shine を付け外しする。 */
    fortuneFx:{seq:0},
    /* 解説用うらないの対象。source は user / kommy / advice。手動で再表示した間だけ待ちを止める。 */
    fortuneContext:null,
    explanationPaused:false,
    /* 記録理由を表示中の候補別「いま＋この先」。 */
    scoreBreakdowns:null,
    /* タイトルの顔の演出。kind は squash（叩く）か hearts（なでる）で、views/TitleScreen.js が seq を見る。 */
    titleFx:{kind:'',seq:0},
    /* 焦点を移す先の選択子。描き直しの後に views/App.js が 1 回だけ移す。 */
    focusReq:{sel:'',seq:0},
  });
  var toastTimer=0;
  var fanfareTimer=0;

  /* 1.8 秒だけ出す。続けて呼ばれたら前の消し忘れを止めて時間を数え直す。 */
  function toast(text){
    s.toast.text=text==null?'':String(text);
    s.toast.seq++;
    s.toast.show=true;
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){s.toast.show=false;},1800);
  }

  /* 文字が無ければ何もしない。動きを減らす設定では 1.2 秒で消す（元の app.js と同じ）。 */
  function fanfare(text){
    if(!text)return;
    s.fanfare.text=String(text);
    s.fanfare.seq++;
    s.fanfare.show=true;
    clearTimeout(fanfareTimer);
    if(REDUCED)fanfareTimer=setTimeout(function(){s.fanfare.show=false;},1200);
  }

  /* 吹き出しを書き換える。分割前の app.js の say から DOM を触る部分だけを引き取った。
     表情は tone で決まり、tone が無いときは状態から決まる既定の表情へ戻す。 */
  function say(l1,l2,chip,tone){
    var b=s.bubble;
    b.l1=l1||'';
    b.l2=l2||'';
    b.chip=chip||'';
    b.tone=tone||'';
    b.open=false;
    b.seq++;
    s.expr=tone==='ok'?'happy':tone==='warn'?'oops':tone==='sad'?'sad':window.TDX.game.baseExpr();
  }

  /* 表情だけを変える（チャットの think / talk と、閉じたときの戻し）。 */
  function setExpr(name){s.expr=name;}

  /* 理由の折り畳みを切り替える。理由が空のときは何もしない（分割前と同じ）。 */
  function toggleReason(){
    if(!s.bubble.l2)return;
    s.bubble.open=!s.bubble.open;
  }

  /* 窓の積みの出し入れ。DOM は触らず、見た目と焦点は views/Modal.js が state.modals から決める。
     opener は閉じたときに焦点を戻す先で、渡されなければ押した物（いま焦点のある要素）を覚える。 */
  function findModal(id){
    for(var i=s.modals.length-1;i>=0;i--)if(s.modals[i].id===id)return i;
    return -1;
  }
  function modalOpen(id){return findModal(id)>=0;}
  function modalOpener(id){
    var i=findModal(id);
    return i<0?null:s.modals[i].opener;
  }
  function openModal(id,opener){
    if(modalOpen(id))return;
    s.modals.push({id:id,opener:opener||document.activeElement||null});
  }
  function closeModal(id){
    var i=findModal(id);
    if(i<0)return null;
    return s.modals.splice(i,1)[0].opener||null;
  }
  function topModal(){return s.modals.length?s.modals[s.modals.length-1].id:null;}

  /* 焦点の依頼。要素を探して移すのは views/App.js で、ここは行き先の選択子を置くだけである。 */
  function focusLater(sel){
    s.focusReq={sel:sel,seq:s.focusReq.seq+1};
  }

  /* タイトルの顔の演出の合図。実際の .squash とハートは views/TitleScreen.js が付ける。 */
  function titleFx(kind){
    s.titleFx={kind:kind,seq:s.titleFx.seq+1};
  }

  return {
    state:s,
    toast:toast,
    fanfare:fanfare,
    say:say,
    setExpr:setExpr,
    toggleReason:toggleReason,
    modalOpen:modalOpen,
    modalOpener:modalOpener,
    openModal:openModal,
    closeModal:closeModal,
    topModal:topModal,
    focusLater:focusLater,
    titleFx:titleFx,
  };
});
})();

/* ==== js/store/policy.js ==== */
/* 方策の店。分割前の app.js の boot() から、方策データを作る部分だけを引き取った。
   中身は模型 M・厳密解 V・方策 STRAT の 3 つと、それを作る solve だけである。
   DOM も画面も知らない。進捗は onProgress(比) で呼び出し側へ返し、帯と文は views/LoadingScreen.js が描く。 */
(function(){
'use strict';

var TD=window.TD;
/* 厳密期待値の検算の値。分割前の boot() と同じである。 */
var ROOT_EV=150.530140109;

TV.defineStore('policy',function(){
  var M=null;
  var V=null;
  var STRAT=null;

  /* generator を 40 ms ずつ回し、間をあけて画面へ返す。終わったら検算して Strategy を作る。
     返す約束は {root, seconds} で解決し、検算か計算の失敗で棄却する（分割前の fail(err) と同じ値を渡す）。 */
  function solve(onProgress){
    return new Promise(function(resolve,reject){
      M=TD.buildModel();
      var g=TD.solve(M);
      var t0=performance.now();
      (function step(){
        var r;
        var ts=performance.now();
        try{
          do{r=g.next();}while(!r.done&&performance.now()-ts<40);
        }catch(err){
          reject(err);
          return;
        }
        if(r.done){
          V=r.value;
          var root=V[255][0];
          if(!(Math.abs(root-ROOT_EV)<1e-6)){
            reject(new Error('方策データの検算に失敗しました（期待値 '+root+'）'));
            return;
          }
          STRAT=new TD.Strategy(M,V);
          resolve({root:root,seconds:(performance.now()-t0)/1000});
          return;
        }
        onProgress(r.value);
        setTimeout(step,0);
      })();
    });
  }

  return {
    get strat(){return STRAT;},
    get model(){return M;},
    solve:solve,
  };
});
})();

/* ==== js/store/tutor.js ==== */
/* 家庭教師の店。分割前の app.js の「アドバイスの記録」「speech」「grading」の 3 節を引き取った。
   持つのは、コミーが言ったことの記録（20.11）と、台詞を吹き出しへ渡す口と、手の採点である。
   DOM は触らない。localStorage は画面ではないので、記録の保存はここに置く。 */
(function(){
'use strict';

var TD=window.TD;
var TDX=window.TDX;
var CAT_SPEECH=TDX.text.CAT_SPEECH;
var rint=TDX.rng.rint;

TV.defineStore('tutor',function(){
  var G=TV.useStore('game');
  var UI=TV.useStore('ui');
  var POLICY=TV.useStore('policy');
  var GM=TDX.game;
  var actP=GM.actP;
  var oppP=GM.oppP;
  var stateOf=GM.stateOf;
  var redCounts=GM.redCounts;
  var handScores=GM.handScores;
  var rerollsLeft=GM.rerollsLeft;

  /* ---------------- アドバイスの記録（20.11） ---------------- */
  /* コミーが吹き出しに出した台詞を試合ごとに溜め、チャットで読み返せるようにする。利用者の入力は入れない（9.2） */
  const ADVICE_MAX=200;
  const ADVICE_KEY='tdt.adviceLog.v1';
  function saveAdviceLog(){
    try{
      const body={schemaVersion:1,matchSeed:G.matchSeed,mode:G.mode,entries:G.adviceLog};
      localStorage.setItem(ADVICE_KEY,JSON.stringify(body));
    }catch(e){}
  }
  /* 試合の復元（11.6）が実装されるまで読み戻しは行わない（復元先がないため loadAdviceLog は作らない） */
  function clearAdviceLog(){
    G.adviceLog=[];
    try{localStorage.removeItem(ADVICE_KEY);}catch(e){}
    saveAdviceLog();
  }
  function turnContext(kind){
    const turn=G.turn;
    if((kind!=='reason'&&kind!=='advice')||!turn||turn.rollNumber<1)return null;
    let held=turn.held.slice();
    if(kind==='advice'&&G.pending&&G.pending.type==='keep'&&G.pending.recHeld){
      held=G.pending.recHeld.slice();
    }
    return {
      rollNumber:turn.rollNumber,
      redFaces:turn.redFaces.slice(),
      green:turn.green,
      held:held,
    };
  }
  function logAdvice(kind,l1,l2,chip,tone,extra){
    if(!kind||kind==='none')return null;
    const L=G.adviceLog;
    const prev=L.length?L[L.length-1]:null;
    /* 原則だけ → 原則＋理由 の 2 回の say を 1 件にまとめる */
    if(kind==='reason'&&prev&&prev.kind==='principle'&&prev.l1===(l1||'')&&prev.chip===(chip||'')){
      prev.l2=l2||'';
      prev.kind='reason';
      prev.turnContext=turnContext(kind);
      saveAdviceLog();
      return prev;
    }
    const e={round:G.round,who:G.active,kind:kind,chip:chip||'',l1:l1||'',l2:l2||'',tone:tone||''};
    const context=turnContext(kind);
    if(context)e.turnContext=context;
    if(extra&&typeof extra==='object')for(const k of Object.keys(extra))e[k]=extra[k];
    L.push(e);
    while(L.length>ADVICE_MAX)L.shift();
    saveAdviceLog();
    return e;
  }

  /* ---------------- 台詞 ---------------- */
  /* 吹き出しと表情は store/ui.js が持ち、views/KommyRow.js が描く。ここは記録を残して店へ渡すだけである。 */
  function setExpr(name){UI.setExpr(name);}
  function say(l1,l2,chip,tone,kind,extra){
    logAdvice(kind===undefined?'info':kind,l1,l2,chip,tone,extra);
    UI.say(l1,l2,chip,tone);
  }
  function toggleReason(){UI.toggleReason();}
  function pickPraise(list){
    let i;
    do{i=rint(G.rng.pres,0,list.length-1);}while(list.length>1&&i===G.lastPraise);
    G.lastPraise=i;
    return list[i];
  }
  /* 理由の 2 行目を読める長さだけ止める。 */
  function holdTime(text){return Math.max(1200,Math.min(4000,text.length*45));}

  /* ---------------- 手を言葉にする ---------------- */
  function faceLabel(i){
    const t=G.turn;
    if(i===4)return t.green===1?'W':String(t.green);
    return String(t.redFaces[i]);
  }
  function keptPhrase(keep,keepGreen){
    const parts=[];
    for(let f=1;f<=6;f++)for(let k=0;k<keep[f-1];k++)parts.push(String(f));
    if(keepGreen)parts.push(G.turn.green===1?'W':String(G.turn.green));
    return parts.join('・');
  }
  function keepActionPhrase(rec){
    if(rec.nKept===5)return{full:'全部残して記録する',stem:'全部残す'};
    if(rec.nKept===0)return{full:'全部振り直す',stem:'全部振り直す'};
    const k=keptPhrase(rec.keep,rec.keepGreen);
    return{full:`${k} を残して振り直す`,stem:`${k} を残す`};
  }
  function catActionPhrase(c,pts){
    return{full:`${CAT_SPEECH[c]}に ${pts} 点で記録する`,stem:`${CAT_SPEECH[c]}に記録する`};
  }
  function heldFromAction(a){
    const held=[false,false,false,false,false];
    const kc=a.keep.slice();
    for(let i=0;i<4;i++){
      const f=G.turn.redFaces[i];
      if(kc[f-1]>0){kc[f-1]--;held[i]=true;}
    }
    held[4]=!!a.keepGreen;
    return held;
  }

  /* ---------------- 採点 ---------------- */
  function gradeKeep(held){
    const p=actP();
    const o=oppP();
    const{keep,keepGreen}=TD.keptFromHeld(G.turn.redFaces,G.turn.green,held);
    const ev=POLICY.strat.evaluateKeep(stateOf(p),stateOf(o),redCounts(),G.turn.green,rerollsLeft());
    const ua=ev.actions.find(a=>TD.sameAction(a,keep,keepGreen));
    const rec=ev.recommended;
    const kctx={own:stateOf(p),opp:stateOf(o),green:G.turn.green,rec,scores:handScores(),remaining:ev.remaining,
      rerollsLeft:rerollsLeft(),userAction:{keep,keepGreen},evalResult:ev,scoresCard:p.categoryScores,strategy:POLICY.strat};
    const facts=TD.keepFacts(kctx);
    const reasons=TD.keepReasons(Object.assign({facts},kctx));
    return{correct:!!(ua&&ua.correct),rec,ev,reasons,facts,recHeld:heldFromAction(rec),userValue:ua?ua.value:null};
  }
  function gradeCategory(cat){
    const p=actP();
    const o=oppP();
    const ev=POLICY.strat.evaluateCategory(stateOf(p),stateOf(o),redCounts(),G.turn.green);
    const c=ev.candidates.find(x=>x.cat===cat);
    const rec=ev.recommended;
    const cctx={own:stateOf(p),opp:stateOf(o),evalResult:ev,rec,scores:handScores(),remaining:ev.remaining,
      userCat:cat,scoresCard:p.categoryScores,strategy:POLICY.strat};
    const facts=TD.catFacts(cctx);
    const reasons=TD.categoryReasons(Object.assign({facts},cctx));
    return{correct:!!(c&&c.correct),rec,ev,reasons,facts,userValue:c?c.value:null};
  }

  return {
    saveAdviceLog:saveAdviceLog,
    clearAdviceLog:clearAdviceLog,
    logAdvice:logAdvice,
    setExpr:setExpr,
    say:say,
    toggleReason:toggleReason,
    pickPraise:pickPraise,
    holdTime:holdTime,
    faceLabel:faceLabel,
    keptPhrase:keptPhrase,
    keepActionPhrase:keepActionPhrase,
    catActionPhrase:catActionPhrase,
    heldFromAction:heldFromAction,
    gradeKeep:gradeKeep,
    gradeCategory:gradeCategory,
  };
});
})();

/* ==== js/store/director.js ==== */
/* 操作の店。部品が押されたことをここへ渡し、ここが状態を動かす。
   分割前の app.js の「利用者の操作」「コミーの手番」と、待ち（wait）・早送り・窓を開く操作を引き取った。
   DOM は触らない。演出（うらないの光・タイトルの顔・焦点）は印を store/ui.js へ置き、部品が受けて行う。 */
(function(){
'use strict';

var TD=window.TD;
var TDX=window.TDX;
var G=TV.useStore('game');
var UI=TV.useStore('ui');
var TUT=TV.useStore('tutor');
var POLICY=TV.useStore('policy');
var GM=TDX.game;

var CAT_SPEECH=TDX.text.CAT_SPEECH;
var PRAISE=TDX.text.PRAISE;
var PRAISE_CAT=TDX.text.PRAISE_CAT;
var composeKeep=TDX.text.composeKeep;
var composeCat=TDX.text.composeCat;
var reasonLines=TDX.text.reasonLines;
var rint=TDX.rng.rint;

var say=TUT.say;
var pickPraise=TUT.pickPraise;
var holdTime=TUT.holdTime;
var logAdvice=TUT.logAdvice;
var gradeKeep=TUT.gradeKeep;
var gradeCategory=TUT.gradeCategory;
var keepActionPhrase=TUT.keepActionPhrase;
var catActionPhrase=TUT.catActionPhrase;
var heldFromAction=TUT.heldFromAction;

var me=GM.me;
var ko=GM.ko;
var stateOf=GM.stateOf;
var redCounts=GM.redCounts;
var handScores=GM.handScores;
var rerollsLeft=GM.rerollsLeft;
var doRoll=GM.doRoll;
var registerAndAdvance=GM.registerAndAdvance;
var canFortune=GM.canFortune;
var canSelect=GM.canSelect;
var applyMood=GM.applyMood;
var isHumanTurn=GM.isHumanTurn;
/* 音の店はこのファイルより後に読み込まれるので、呼ぶときに取る。鳴らしてよいかは音の店が決める。 */
function sound(){return TV.useStore('sound');}
/* 採点・称賛・助言をしないモード（ガチ対戦とふたりで対戦） */
function ungraded(){return G.mode==='serious'||G.mode==='pvp';}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- 待ち ---------------- */
/* チャットか手動の解説用うらないを開いているあいだは時間を数えない。 */
let skipFlag=false;
async function wait(ms){
  const kommyFast=G.kommyQuiet&&G.active==='kommy';
  const target=(G.fast||kommyFast)?Math.min(ms,180):ms;
  let el=0;
  skipFlag=false;
  while(el<target){
    if(skipFlag){skipFlag=false;break;}
    await sleep(40);
    if(!G.chatOpen&&!UI.state.explanationPaused)el+=40;
  }
}

/* ---------------- 押せるかどうか ---------------- */
/* views/Controls.js の #btnRoll と同じ条件。キーボードの R もこれで決める。 */
function canRoll(){
  const t=G.turn;
  const user=isHumanTurn()&&t&&!G.busy&&!G.pending;
  if(!user)return false;
  const again=t.rollNumber<3&&t.held.some(function(x){return !x;});
  return t.rollNumber===0||again;
}
/* views/Scorecard.js の #btnRegister と同じ条件。キーボードの Enter もこれで決める。 */
function canRegister(){return canSelect()&&G.selCat!=null;}

function copyTurn(turn,held){
  return{rollNumber:turn.rollNumber,redFaces:turn.redFaces.slice(),green:turn.green,held:(held||turn.held).slice()};
}
function targetForHeld(turn,held){
  const action=TD.keptFromHeld(turn.redFaces,turn.green,held);
  action.keepIdx=POLICY.strat.m.keepIndex.get(action.keep.join(','));
  return POLICY.strat.targetDistribution(stateOf(G.players[G.active]),stateOf(G.players[G.active==='user'?'kommy':'user']),action,turn.green,rerollsLeft());
}
function setFortuneContext(source,automatic,turn,held,targetDistribution){
  UI.state.fortuneContext={source:source,automatic:!!automatic,turn:copyTurn(turn,held),targetDistribution:targetDistribution};
  UI.state.explanationPaused=false;
  G.fortune=true;
  UI.state.fortuneFx.seq++;
}
function closeFortune(clearContext){
  G.fortune=false;
  UI.state.explanationPaused=false;
  if(clearContext)UI.state.fortuneContext=null;
}

/* ---------------- 利用者の操作 ---------------- */
function toggleHeld(i){
  const t=G.turn;
  if(!t||!isHumanTurn()||t.rollNumber===0||t.rollNumber>=3||G.busy||G.pending)return;
  t.held[i]=!t.held[i];
  sound().play(t.held[i]?'se_keep':'se_unkeep');
  if(UI.state.fortuneContext&&UI.state.fortuneContext.source==='user')setFortuneContext('user',false,t,t.held,targetForHeld(t,t.held));
  UI.focusLater('#dice [data-i="'+i+'"]');
}
/* アリスのうらない（述語は store/game.js、表と光は views/Scorecard.js が持つ） */
function toggleFortune(){
  const context=UI.state.fortuneContext;
  if(G.fortune){closeFortune(!context||context.source==='user');UI.state.fortuneFx.seq++;sound().play('se_fortune_close');return;}
  if(context&&context.source!=='user'&&GM.canExplanationFortune()){
    context.automatic=false;UI.state.explanationPaused=true;G.fortune=true;UI.state.fortuneFx.seq++;return;
  }
  if(!GM.canUserFortune())return;
  setFortuneContext('user',false,G.turn,G.turn.held,targetForHeld(G.turn,G.turn.held));
  sound().play('se_fortune_open');
}
async function userRoll(){
  const t=G.turn;
  if(!t||!isHumanTurn()||G.busy||G.pending)return;
  if(t.rollNumber===0){await doRoll();return;}
  if(t.rollNumber>=3||!t.held.some(x=>!x))return;
  /* ガチ対戦とふたりで対戦は採点しない */
  if(ungraded()){await doRoll();return;}
  const g=gradeKeep(t.held);
  G.stats.decisions++;
  if(g.correct){
    G.stats.correct++;
    say(pickPraise(PRAISE),'',composeKeep(g.reasons[0],g.facts,'').chip,'ok','praise');
    await doRoll();
    return;
  }
  showAdvice({type:'keep',g,onFix:async()=>{t.held=g.recHeld.slice();await doRoll();},
    onKeep:async()=>{await doRoll();}});
}
async function userRegister(){
  const t=G.turn;
  /* うらない中は記録できない */
  if(!t||!isHumanTurn()||G.busy||G.pending||G.fortune||t.rollNumber===0||G.selCat==null)return;
  const cat=G.selCat;
  /* ガチ対戦とふたりで対戦は採点も助言もせず、そのまま記録する（早期登録も同じ） */
  if(ungraded()){await registerAndAdvance(cat);return;}
  if(t.rollNumber<3){
    /* 早期登録は「全部残す」と同じ手なので、まずキープの判断として採点する */
    const all=[true,true,true,true,true];
    const g=gradeKeep(all);
    G.stats.decisions++;
    if(!g.correct){
      showAdvice({type:'keep',g,early:true,onFix:async()=>{t.held=g.recHeld.slice();await doRoll();},
        onKeep:async()=>{await registerFlow(cat,false);}});
      return;
    }
    G.stats.correct++;
  }
  await registerFlow(cat,true);
}
async function registerFlow(cat,praiseOk){
  const p=me();
  /* 残りが 1 つなら選びようがないので採点しない */
  if(TD.popcount(p.availableMask)===1){await registerAndAdvance(cat);return;}
  const g=gradeCategory(cat);
  G.stats.decisions++;
  if(g.correct){
    G.stats.correct++;
    if(praiseOk)say(pickPraise(PRAISE_CAT),'',composeCat(g.reasons[0],g.facts,'').chip,'ok','praise');
    await registerAndAdvance(cat);
    return;
  }
  showAdvice({type:'category',g,cat,onFix:async()=>{await registerAndAdvance(g.rec.cat);},
    onKeep:async()=>{await registerAndAdvance(cat);}});
}
function showAdvice(opt){
  const g=opt.g;
  G.stats.advised++;
  const ph=opt.type==='keep'?keepActionPhrase(g.rec):catActionPhrase(g.rec.cat,g.rec.points);
  const rl=reasonLines(g.reasons,ph.stem,opt.type==='keep',g.facts);
  const l1=`こういうときは ${ph.full}にゃ`;
  G.pending={type:opt.type,rec:g.rec,recHeld:g.recHeld,cat:opt.cat,facts:g.facts};
  say(l1,rl.reason,rl.chip,'warn','advice');
  /* 枠の中身と焦点は views/AdvicePanel.js が G.advice から決める。ここは何を出すかを置くだけである。 */
  G.advice={chip:rl.chip,l1:l1,reason:rl.reason,early:!!opt.early,onFix:opt.onFix,onKeep:opt.onKeep};
  if(opt.type==='keep')setFortuneContext('advice',true,G.turn,g.recHeld,g.facts.targetDistribution);
  else UI.state.scoreBreakdowns=g.facts.breakdowns;
}
/* 「おすすめに直す」。分割前の b1 のリスナと同じ順で、最後に受け取った手を実行する。 */
async function adviceFix(){
  if(!G.pending)return;
  const a=G.advice;
  G.pending=null;
  G.advice=null;
  closeFortune(true);
  UI.state.scoreBreakdowns=null;
  say('それでいいにゃ。','','','ok','none');
  logAdvice('choice','→ おすすめに直した');
  if(a&&a.onFix)await a.onFix();
}
/* 「このまま進む」。同じく分割前の b2 のリスナと同じである。 */
async function adviceKeep(){
  if(!G.pending)return;
  const a=G.advice;
  G.pending=null;
  G.advice=null;
  closeFortune(true);
  UI.state.scoreBreakdowns=null;
  say('わかったにゃ、教主の手で進めるにゃ。','','','','none');
  logAdvice('choice','→ このまま進んだ');
  if(a&&a.onKeep)await a.onKeep();
}

/* ---------------- コミーの手番 ---------------- */
async function kommyTurn(){
  const gid=G.gameId;
  const p=ko();
  const o=me();
  const isQuiet=function(){
    return G.mode==='serious'||G.kommyQuiet;
  };
  say('コミーの番にゃ。','','','','turn');
  await wait(rint(G.rng.pres,500,900));
  if(gid!==G.gameId)return;
  if(!await doRoll())return;
  while(gid===G.gameId&&G.phase==='playing'){
    await wait(rint(G.rng.pres,500,900));
    if(gid!==G.gameId)return;
    const t=G.turn;
    const rl=rerollsLeft();
    let keepRec=null;
    if(rl>0){
      const ev=POLICY.strat.evaluateKeep(stateOf(p),stateOf(o),redCounts(),t.green,rl);
      keepRec=ev.recommended;
      if(keepRec.nKept<5){
        /* ガチ対戦：原則も理由も言わず、手だけ指す */
        if(isQuiet()){
          t.held=heldFromAction(keepRec);
          await wait(rint(G.rng.pres,500,900));
          if(gid!==G.gameId)return;
          if(!await doRoll())return;
          continue;
        }
        const kctx={own:stateOf(p),opp:stateOf(o),green:t.green,rec:keepRec,scores:handScores(),
          remaining:ev.remaining,rerollsLeft:rl,evalResult:ev,scoresCard:p.categoryScores,strategy:POLICY.strat};
        const facts=TD.keepFacts(kctx);
        const reasons=TD.keepReasons(Object.assign({facts:facts},kctx));
        const ph=keepActionPhrase(keepRec);
        const rlns=reasonLines(reasons,ph.stem,true,facts);
        say(`こういうときは ${ph.full}にゃ`,'',rlns.chip,'','principle');
        await wait(rint(G.rng.pres,700,1200));
        if(gid!==G.gameId)return;
        t.held=heldFromAction(keepRec);
        if(!G.fast)setFortuneContext('kommy',true,t,t.held,facts.targetDistribution);
        say(`こういうときは ${ph.full}にゃ`,rlns.reason,rlns.chip,'','reason');
        await wait(holdTime(rlns.reason)+(G.fast?0:1500));
        if(gid!==G.gameId)return;
        closeFortune(true);
        if(!await doRoll())return;
        continue;
      }
    }
    /* 記録する */
    const ev=POLICY.strat.evaluateCategory(stateOf(p),stateOf(o),redCounts(),t.green);
    const rec=ev.recommended;
    /* ガチ対戦：結果だけを言う */
    if(isQuiet()){
      G.koSel=rec.cat;
      await wait(rint(G.rng.pres,500,900));
      if(gid!==G.gameId)return;
      const pts=handScores()[rec.cat];
      say(`${CAT_SPEECH[rec.cat]}に ${pts} 点にゃ`,'','','','register');
      await registerAndAdvance(rec.cat);
      return;
    }
    const cctx={own:stateOf(p),opp:stateOf(o),evalResult:ev,rec,scores:handScores(),remaining:ev.remaining,
      scoresCard:p.categoryScores,strategy:POLICY.strat};
    const facts=TD.catFacts(cctx);
    const reasons=TD.categoryReasons(Object.assign({facts:facts},cctx));
    const ph=catActionPhrase(rec.cat,rec.points);
    const rlns=reasonLines(reasons,ph.stem,false,facts);
    const pre=(keepRec&&keepRec.nKept===5&&rl>0)?'この形はもう振らないにゃ。':'';
    say(`${pre}こういうときは ${ph.full}にゃ`,'',rlns.chip,'','principle');
    await wait(rint(G.rng.pres,700,1200));
    if(gid!==G.gameId)return;
    G.koSel=rec.cat;
    UI.state.scoreBreakdowns=facts.breakdowns;
    say(`${pre}こういうときは ${ph.full}にゃ`,rlns.reason,rlns.chip,'','reason');
    await wait(holdTime(rlns.reason));
    if(gid!==G.gameId)return;
    UI.state.scoreBreakdowns=null;
    await registerAndAdvance(rec.cat);
    return;
  }
}

/* チャットの店。分割前の app.js の chat 節から、状態と流れだけを引き取った。
   発言の要素は views/ChatModal.js が持ち、この店は mount のときに預かった sink を通して書く。

(function(){

var G=TV.useStore('game');
var UI=TV.useStore('ui');
var TUT=TV.useStore('tutor');
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var rint=TDX.rng.rint;
var setExpr=TUT.setExpr;
var baseExpr=TDX.game.baseExpr;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* 話しかけられたときの前置きの一言。どれを出すかは試合の chat 系列で決まる。 */

  "ふむふむ、協業の章を引くにゃ",
  "その悩みは本源的蓄積から来てるにゃ",
  "なるほど、それは資本家の視点にゃ",
  "教主、それは交換過程の話に聞こえるにゃ",
  "コミーはそういう話が大好きにゃ",
  "それは貨幣の流通手段としての機能にゃ",
  "いい質問にゃ。答えは長い引用になるにゃ",

/* 表示は最新 5 件だけ残す（利用者の指示）。読み上げ位置は pos で別管理 */
var CHAT_KEEP=5;

TV.defineStore('chat',function(){
  var CHAT=TV.reactive({loaded:false,loading:false,lines:null,streaming:false,token:0,failed:false});
  /* 入力欄と話題の選択。views/ChatModal.js が v-model で書き、送信のときにここから読む。 */
  var input=TV.reactive({text:'',topic:'',shakeSeq:0});
  /* 発言の要素の出し入れ。views/ChatModal.js が mount のときに預ける。 */
  var sink=null;
  function attachLog(s){sink=s;}

  function chatTopic(){return input.topic||null;}
  function shakeTopics(){input.shakeSeq++;}

  /* コーパスは 1 度だけ遅延で読む。<script> の挿入はこの店が DOM に触れる唯一の場所である。 */
  function loadCorpus(){
    CHAT.loading=true;
    CHAT.failed=false;
    const s=document.createElement('script');
    s.src='assets/data/kommy-corpus.js?v='+encodeURIComponent((window.BUILD_INFO&&window.BUILD_INFO.builtAt)||'1');
    s.async=true;
    s.onload=()=>{
      CHAT.loading=false;
      const c=window.KOMMY_CORPUS;
      const ok=c&&c.meta&&c.meta.schemaVersion===1&&Array.isArray(c.lines)&&c.lines.length>0;
      if(ok&&c.lines.length===c.meta.lineCount){CHAT.lines=c.lines;CHAT.loaded=true;}
      else{CHAT.failed=true;corpusFailUi();}
    };
    s.onerror=()=>{
      CHAT.loading=false;
      CHAT.failed=true;
      corpusFailUi();
    };
    document.head.appendChild(s);
  }
  function corpusFailUi(){
    if(sink)sink.addRetry(loadCorpus);
  }
  /* 記録を先頭から全件描き直す。中身を組むのは views/ChatModal.js である（20.11） */
  function renderAdviceLog(){
    if(sink)sink.renderAdvice();
  }

  /* 窓は部品が描くので、記録の描き直しと焦点は .hidden が外れた次の描画を待ってから行う。 */
  function openChat(opener){
    if(G.phase==='loading')return;
    G.chatOpen=true;
    UI.openModal('ovChat',opener);
    TV.nextTick(function(){
      if(!sink)return;
      sink.renderAdvice();
      sink.focusInput();
    });
    if(!CHAT.loaded&&!CHAT.loading)loadCorpus();
  }
  /* 閉じたときに開いた側へ焦点を戻すのは views/ChatModal.js の watch である。 */
  function closeChat(){
    chatStop();
    G.chatOpen=false;
    UI.closeModal('ovChat');
    setExpr(baseExpr());
    input.text='';
    input.topic='';
    if(sink)sink.clear();
  }

  async function chatSend(){
    const txt=input.text;
    const n=Array.from(txt).length;
    if(!CHAT.loaded||!txt.trim()||n>500)return;
    /* 話題は未選択なら警告（選択自体は挙動に影響しない） */
    if(!chatTopic()){shakeTopics();return;}
    if(!sink)return;
    const log=sink;
    log.append('user',txt);
    input.text='';
    const token=++CHAT.token;
    CHAT.streaming=true;
    setExpr('think');
    const alive=()=>token===CHAT.token;
    /* 1) 考え中（0.5 秒以上） */
    let dots=log.thinking('コミーが考え中');
    await sleep(rint(G.rng.chat,800,2400));
    if(!alive()){dots.remove();return;}
    dots.remove();
    /* 2) 前置きの一言 */
    log.append('kommy',CHAT_PREFACE[Math.floor(G.rng.chat()*CHAT_PREFACE.length)]);
    /* 3) もう一度ランダムに待つ */
    dots=log.thinking('コミーが考え中');
    await sleep(rint(G.rng.chat,600,2200));
    if(!alive()){dots.remove();return;}
    dots.remove();
    setExpr('talk');
    /* 4) 資本論をランダムな位置から延々と */
    let pos=Math.floor(G.rng.chat()*CHAT.lines.length);
    while(alive()){
      const line=CHAT.lines[pos];
      const d=log.append('kommy','');
      if(REDUCED){
        d.setText(line);
        await sleep(200);
      }else{
        const chars=Array.from(line);
        for(const ch of chars){
          if(!alive())return;
          d.addChar(ch);
          await sleep(rint(G.rng.chat,25,45));
        }
      }
      if(!alive())return;
      pos=(pos+1)%CHAT.lines.length;
      /* ときどき止まって考える素振り */
      if(G.rng.chat()<0.18){
        setExpr('think');
        const th=log.thinking('……');
        await sleep(rint(G.rng.chat,1000,3000));
        th.remove();
        if(!alive())return;
        setExpr('talk');
      }
      await sleep(rint(G.rng.chat,300,700));
    }
  }
  function chatStop(){
    if(!CHAT.streaming)return;
    CHAT.token++;
    CHAT.streaming=false;
    setExpr(baseExpr());
  }

  return {
    state:CHAT,
    input:input,
    CHAT_KEEP:CHAT_KEEP,
    attachLog:attachLog,
    chatTopic:chatTopic,
    shakeTopics:shakeTopics,
    loadCorpus:loadCorpus,
    renderAdviceLog:renderAdviceLog,
    openChat:openChat,
    closeChat:closeChat,
    chatSend:chatSend,
    chatStop:chatStop,
  };
});
})();

/* ==== js/store/sound.js ==== */
/* 音の店（仕様書 21.5）。core/sound-engine.js に Web Audio と fetch を渡し、鳴らしてよい条件を試合の状態から答える。
   DOM は知らない。ページが隠れたときの停止は views/App.js が visibilitychange を受けて suspend／resume を呼ぶ。
   音のファイルは ゲームHTML/assets/audio/ にあり、一覧は build.py が埋め込む window.TDX.audioManifest である。 */
(function(){
'use strict';

var TDX=window.TDX;

TV.defineStore('sound',function(){
  var G=TV.useStore('game');
  var s=TV.reactive({muted:false});

  var engine=TDX.soundEngine.create({
    manifest:TDX.audioManifest,
    baseUrl:'assets/audio/',
    createContext:function(){
      var Ctor=window.AudioContext||window.webkitAudioContext;
      return Ctor?new Ctor():null;
    },
    createDecoder:function(){
      var Ctor=window.OfflineAudioContext||window.webkitOfflineAudioContext;
      return Ctor?new Ctor(1,1,TDX.audioManifest.sampleRate):null;
    },
    fetchBytes:function(url){
      return fetch(url).then(function(response){
        if(!response.ok)throw new Error(url+' '+response.status);
        return response.arrayBuffer();
      });
    },
    /* 鳴らすのは、ふたりで対戦の試合中とその結果だけ */
    canPlay:function(){
      return G.mode==='pvp'&&(G.phase==='playing'||G.phase==='result');
    },
  });

  return {
    state:s,
    /* 「ふたりで対戦」「もう一度」のクリック処理の中で呼ぶ。読み込みは初回だけ始まる。 */
    unlock:function(){
      if(engine.unlock())engine.load();
    },
    /* タイトルでごきげんになったら、鳴らさずに読み込みだけ始める。
       押した瞬間の開始音に間に合わせるためで、タイトルでは canPlay が偽なので何も鳴らない。 */
    prefetch:function(){
      engine.prefetch();
    },
    play:engine.play,
    startBgm:engine.startBgm,
    stopBgm:engine.stopBgm,
    stopAll:engine.stopAll,
    suspend:engine.suspend,
    resume:engine.resume,
    toggleMuted:function(){
      s.muted=!s.muted;
      engine.setMuted(s.muted);
    },
  };
});
})();

/* ==== js/viewmodel/turnStatus.js ==== */
(function(root){
'use strict';

const TDX = root.TDX || (root.TDX = {});
const viewmodel = TDX.viewmodel || (TDX.viewmodel = {});
/* 名前と手番の持ち主は viewmodel/players.js で決める（Node の検査では require で取る）。 */
function players() {
  if(TDX.viewmodel.players){
    return TDX.viewmodel.players;
  }
  return typeof require==='function'?require('./players.js'):null;
}

function roundText(game) {
  const activePlayer = players().playerLabel(game.mode, game.active);
  return `ラウンド ${Math.min(game.round, 8)} / 8・${activePlayer}の番`;
}

function rollText(turn) {
  if (!turn) {
    return '';
  }
  if (turn.rollNumber === 0) {
    return 'まだ振っていません';
  }
  return `残り振り直し ${3 - turn.rollNumber} 回`;
}

function accessibleStatus(game) {
  if (game.phase === 'result') {
    return '試合終了';
  }
  const activePlayer = players().playerLabel(game.mode, game.active);
  return `${Math.min(game.round, 8)} / 8・${activePlayer}の手番`;
}

const api = { roundText, rollText, accessibleStatus };
viewmodel.turnStatus = api;

if (typeof module !== 'undefined' && module.exports) {
  module.exports = api;
}
})(typeof window !== 'undefined' ? window : globalThis);

/* 名前と手番の持ち主は viewmodel/players.js で決める（Node の検査では require で取る）。 */
function players() {
  if(TDX.viewmodel.players){
    return TDX.viewmodel.players;
  }
  return typeof require==='function'?require('./players.js'):null;
}
const PIP_POSITIONS={
  1:[4],
  2:[0,8],
  3:[0,4,8],
  4:[0,2,6,8],
  5:[0,2,4,6,8],
  6:[0,2,3,5,6,8],
};

function pipRow(face) {
  const activePositions=PIP_POSITIONS[face];
  const pips=[];
  for(let position=0;position<9;position++){
    pips.push(activePositions.includes(position));
  }
  return pips;
}

function dieView({turn,index,userCanDecide,recommendedHeld,animationFaces}) {
  const isGreen=index===4;
  const face=!turn||turn.rollNumber===0
    ?null
    :isGreen?turn.green:turn.redFaces[index];
  const isRolling=!!(animationFaces&&animationFaces[index]!=null);
  const shownFace=isRolling?animationFaces[index]:face;
  const isHeld=turn?turn.held[index]:false;
  const canKeep=!!(userCanDecide&&turn.rollNumber<3);
  const showsElf=shownFace!=null&&isGreen&&shownFace===1;
  const faceText=shownFace==null?'未投':showsElf?'W':String(shownFace);
  const classes=[];
  const labelClasses=[];

  if(isGreen){
    classes.push('green');
  }
  if(face==null&&!isRolling){
    classes.push('blank');
  }
  if(isRolling){
    classes.push('rolling');
  }
  if(recommendedHeld){
    classes.push(recommendedHeld[index]?'rec-keep':'rec-roll');
  }
  if(canKeep&&!isHeld&&!isRolling&&!recommendedHeld){
    classes.push('free');
  }
  if(isHeld){
    labelClasses.push('keep');
  }
  if(canKeep&&!isHeld){
    labelClasses.push('tap');
  }

  let text='';
  if(isHeld){
    text='KEEP';
  }else if(recommendedHeld){
    text=recommendedHeld[index]?'残す':'振る';
  }

  return {
    classes:classes,
    pressed:isHeld?'true':'false',
    ariaLabel:`${isGreen?'緑':'赤'}のサイコロ ${index+1}、出目 ${faceText}${isHeld?'、KEEP 中':''}`,
    disabled:!userCanDecide,
    showsElf:showsElf,
    pips:shownFace!=null&&!showsElf?pipRow(shownFace):null,
    labelClasses:labelClasses,
    tapKeep:!isHeld&&!recommendedHeld&&canKeep,
    text:text,
  };
}

function buildDice(game) {
  const turn=game.turn;
  const userCanDecide=!!(
    players().isHumanSide(game.mode,game.active)
    &&turn
    &&turn.rollNumber>0
    &&!game.busy
    &&!game.pending
  );
  const recommendedHeld=game.pending&&game.pending.type==='keep'
    ?game.pending.recHeld
    :null;
  const dice=[];
  for(let i=0;i<5;i++){
    dice.push(dieView({
      turn:turn,
      index:i,
      userCanDecide:userCanDecide,
      recommendedHeld:recommendedHeld,
      animationFaces:game.anim,
    }));
  }
  return dice;
}

function validHistoryContext(context) {
  return !!(
    context
    &&Number.isInteger(context.rollNumber)
    &&context.rollNumber>=1
    &&context.rollNumber<=3
    &&Array.isArray(context.redFaces)
    &&context.redFaces.length===4
    &&context.redFaces.every(face => Number.isInteger(face)&&face>=1&&face<=6)
    &&Number.isInteger(context.green)
    &&context.green>=1
    &&context.green<=6
    &&Array.isArray(context.held)
    &&context.held.length===5
    &&context.held.every(held => typeof held==='boolean')
  );
}

function historyFaceLabel(context,index) {
  if(index===4){
    return `緑${context.green===1?'W':context.green}`;
  }
  return `赤${context.redFaces[index]}`;
}

function buildHistoryDice(context) {
  if(!validHistoryContext(context)){
    return null;
  }
  const turn={
    rollNumber:context.rollNumber,
    redFaces:context.redFaces.slice(),
    green:context.green,
    held:context.held.slice(),
  };
  const dice=[];
  const faceLabels=[];
  const heldLabels=[];
  for(let index=0;index<5;index++){
    dice.push(dieView({
      turn:turn,
      index:index,
      userCanDecide:false,
      recommendedHeld:null,
      animationFaces:null,
    }));
    const label=historyFaceLabel(context,index);
    faceLabels.push(label);
    if(context.held[index]){
      heldLabels.push(label);
    }
  }
  const keepText=heldLabels.length?`KEEPは${heldLabels.join('、')}`:'KEEPなし';
  return {
    rollText:`${context.rollNumber}投目`,
    ariaLabel:`${context.rollNumber}投目。出目は${faceLabels.join('、')}。${keepText}。`,
    dice:dice,
  };
}

const api={pipRow,dieView,buildDice,buildHistoryDice};
viewmodel.dice=api;

if(typeof module!=='undefined'&&module.exports){
  module.exports=api;
}
})(typeof window!=='undefined'?window:globalThis);

/* 名前と手番の持ち主は viewmodel/players.js で決める（Node の検査では require で取る）。 */

   文字のリンクだけを出し、サムネイルや埋め込みは読まない（外部へ通信しない）。 */
const RECOMMENDED_VIDEO={
  title:'臭い豚ラーメンに鼻水いれてスープ炊いたら108人がやべえ病気に',
  url:'https://www.nicovideo.jp/watch/sm46511118',
};

function recommendationFor(mode,userTotal,kommyTotal) {
  const lost=userTotal<kommyTotal;
  return lost&&(mode==='tutor'||mode==='serious')?RECOMMENDED_VIDEO:null;
}

function buildRows(user,kommy) {
  const categoryLabels=TDX.text.CAT_LABEL;
  const rows=[];
  for(let category=0;category<8;category++){
    rows.push({
      label:categoryLabels[category],
      me:user.categoryScores[category],
      ko:kommy.categoryScores[category],
    });
    if(category===4){
      rows.push({
        label:`上段ボーナス（${user.upperRaw} / ${kommy.upperRaw}）`,
        me:user.bonusAwarded?40:0,
        ko:kommy.bonusAwarded?40:0,
      });
    }
  }
  return rows;
}

function resultTitle(userTotal,kommyTotal,mode) {
  if(mode==='pvp'){
    if(userTotal===kommyTotal){
      return '引き分け';
    }
    return `${players().playerLabel(mode,userTotal>kommyTotal?'user':'kommy')}の勝ち！`;
  }
  if(userTotal>kommyTotal){
    return '勝利！';
  }
  if(userTotal<kommyTotal){
    return '敗北…';
  }
  return '引き分け';
}

function buildResult(game) {
  const serious=game.mode==='serious';
  const pvp=game.mode==='pvp';
  const names=[players().playerLabel(game.mode,'user'),players().playerLabel(game.mode,'kommy')];
  /* 表の列は狭いので、ふたりで対戦では P1／P2 に縮める（読み上げは names を使う） */
  const shortNames=[
    players().playerLabel(game.mode,'user',{short:true}),
    players().playerLabel(game.mode,'kommy',{short:true}),
  ];
  const badge=players().modeTagText(game.mode);
  const playerStates=game.players;
  const stat=serious||pvp||!game.stats
    ?''
    :`助言を受けずに正解した戦略判断：${game.stats.correct} / ${game.stats.decisions}`;
  if(!playerStates){
    return {
      players:null,
      me:'',
      ko:'',
      serious:serious,
      mode:game.mode,
      names:names,
      shortNames:shortNames,
      badge:badge,
      recommend:null,
      title:'',
      stat:stat,
      canShare:false,
      rows:[],
    };
  }

  const userTotal=playerStates.user.total;
  const kommyTotal=playerStates.kommy.total;
  return {
    players:playerStates,
    me:userTotal,
    ko:kommyTotal,
    serious:serious,
    mode:game.mode,
    names:names,
    shortNames:shortNames,
    badge:badge,
    recommend:recommendationFor(game.mode,userTotal,kommyTotal),
    title:resultTitle(userTotal,kommyTotal,game.mode),
    stat:stat,
    /* 共有文は「コミーに勝った」前提なので、ふたりで対戦では出さない（決定 Q16） */
    canShare:!pvp&&userTotal>kommyTotal,
    rows:buildRows(playerStates.user,playerStates.kommy),
  };
}

/* ==== js/viewmodel/faceGesture.js ==== */
(function(root){
'use strict';

const TDX=root.TDX||(root.TDX={});
const viewmodel=TDX.viewmodel||(TDX.viewmodel={});
const HIT_MOVE_LIMIT=10;
const PET_WIDTH_RATIO=0.25;
const PET_MIN_DISTANCE=40;

function start(pointerId,clientX) {
  return {
    pointerId:pointerId,
    lastX:clientX,
    distance:0,
    completed:false,
  };
}

function move(gesture,event,faceWidth) {
  if(!gesture||gesture.pointerId!==event.pointerId||gesture.completed){
    return {gesture:gesture,command:null};
  }

  const distance=gesture.distance+Math.abs(event.clientX-gesture.lastX);
  const petThreshold=Math.max(PET_MIN_DISTANCE,faceWidth*PET_WIDTH_RATIO);
  const completed=distance>=petThreshold;
  return {
    gesture:{
      pointerId:gesture.pointerId,
      lastX:event.clientX,
      distance:distance,
      completed:completed,
    },
    command:completed?'pet':null,
  };
}

function finish(gesture,event) {
  if(!gesture||gesture.pointerId!==event.pointerId){
    return {gesture:gesture,command:null};
  }
  if(gesture.completed){
    return {gesture:null,command:null};
  }

  const outside=(
    event.clientX<0
    ||event.clientY<0
    ||event.clientX>event.viewportWidth
    ||event.clientY>event.viewportHeight
  );
  const command=!outside&&gesture.distance<=HIT_MOVE_LIMIT?'hit':null;
  return {gesture:null,command:command};
}

function cancel(gesture,pointerId) {
  if(!gesture||gesture.pointerId!==pointerId){
    return gesture;
  }
  return null;
}

const api={start,move,finish,cancel};
viewmodel.faceGesture=api;

if(typeof module!=='undefined'&&module.exports){
  module.exports=api;
}
})(typeof window!=='undefined'?window:globalThis);

/* ==== js/viewmodel/keyCommand.js ==== */
(function(root){
'use strict';

const TDX=root.TDX||(root.TDX={});
const viewmodel=TDX.viewmodel||(TDX.viewmodel={});

function commandForKey(event,context) {
  if(event.key==='Escape'){
    if(!context.topModal||context.topModal==='ovResult'){
      return null;
    }
    if(context.topModal==='ovChat'){
      return {type:'close-chat',preventDefault:true};
    }
    return {
      type:'close-modal',
      modalId:context.topModal,
      preventDefault:true,
    };
  }

  if(context.topModal){
    const sendsChat=(
      context.topModal==='ovChat'
      &&event.key==='Enter'
      &&(event.ctrlKey||event.metaKey)
      &&!event.isComposing
      &&event.keyCode!==229
      &&context.targetId==='chatText'
    );
    if(sendsChat){
      return {type:'chat-send',preventDefault:true};
    }
    if(event.key==='Tab'){
      return {
        type:'wrap-tab',
        modalId:context.topModal,
        preventDefault:false,
      };
    }
    return null;
  }

  if(context.phase!=='playing'){
    return null;
  }
  const targetTag=(context.targetTag||'').toLowerCase();
  if(targetTag==='textarea'||targetTag==='input'){
    return null;
  }
  if(event.key>='1'&&event.key<='5'){
    return {
      type:'toggle-held',
      index:Number(event.key)-1,
      preventDefault:true,
    };
  }
  if((event.key==='r'||event.key==='R')&&context.canRoll){
    return {type:'roll',preventDefault:true};
  }
  if(event.key==='Enter'&&targetTag!=='button'&&context.canRegister){
    return {type:'register',preventDefault:true};
  }
  /* 早送りはコミーが自分で指している手番だけ（ふたりで対戦のプレイヤー2 は人なので効かない） */
  if(event.key===' '&&context.active==='kommy'&&context.mode!=='pvp'){
    return {type:'skip',preventDefault:false};
  }
  return null;
}

const api={commandForKey};
viewmodel.keyCommand=api;

if(typeof module!=='undefined'&&module.exports){
  module.exports=api;
}
})(typeof window!=='undefined'?window:globalThis);

/* ==== js/viewmodel/scoreTable.js ==== */
(function(root){
'use strict';

const TDX=root.TDX||(root.TDX={});
const viewmodel=TDX.viewmodel||(TDX.viewmodel={});
const rules=root.TD;
/* 名前と手番の持ち主は viewmodel/players.js で決める（Node の検査では require で取る）。 */
function players() {
  if(TDX.viewmodel.players){
    return TDX.viewmodel.players;
  }
  return typeof require==='function'?require('./players.js'):null;
}

function candidateScores(game) {
  const turn=game.turn;
  if(!turn||turn.rollNumber===0){
    return null;
  }
  return rules.scoreFromFaces(turn.redFaces,turn.green);
}

function scoreCell(game,player,who,category,scores,options,recommendedCategory) {
  const recordedScore=player.categoryScores[category];
  if(recordedScore!=null){
    return {
      kind:'done',
      zero:recordedScore===0,
      value:recordedScore,
      flash:options.flash.who===who&&options.flash.cat===category,
    };
  }
  if(game.active!==who||!scores){
    return {kind:'empty'};
  }

  /* 人が操作する側の候補だけ押せる。コミーが自分で指す側は .kommy で押せなくする（views/Scorecard.js が見る）。 */
  const isHuman=players().isHumanSide(game.mode,who);
  const classes=[];
  if(!isHuman){
    classes.push('kommy');
  }
  if(who==='user'&&recommendedCategory===category){
    classes.push('rec');
  }
  const selectedCategory=isHuman?game.selCat:game.koSel;
  const breakdown=options.breakdowns&&options.breakdowns[category];
  const breakdownText=breakdown?`${TDX.text.fmt1(breakdown.current)}＋${TDX.text.fmt1(breakdown.future)}`:null;
  const breakdownAria=breakdown?`、いま ${TDX.text.fmt1(breakdown.current)} 点、この先 ${TDX.text.fmt1(breakdown.future)} 点`:'';
  return {
    kind:'candidate',
    classes:classes,
    category:category,
    pressed:String(selectedCategory===category),
    disabled:!(isHuman&&options.canSelect),
    ariaLabel:`${TDX.text.CAT_SPEECH[category]} に ${scores[category]} 点${breakdownAria}`,
    points:scores[category],
    breakdown:breakdownText,
  };
}

function scoreRow(game,category,scores,options,recommendedCategory) {
  const isSelected=options.canSelect&&game.selCat===category;
  return {
    category:category,
    isSelected:isSelected,
    canRegister:isSelected,
    isLower:category>=5,
    description:TDX.text.CAT_DESC[category],
    label:TDX.text.CAT_LABEL[category],
    registerAriaLabel:`${TDX.text.CAT_SPEECH[category]} に記録する`,
    cells:[
      scoreCell(
        game,
        game.players.user,
        'user',
        category,
        scores,
        options,
        recommendedCategory,
      ),
      scoreCell(
        game,
        game.players.kommy,
        'kommy',
        category,
        scores,
        options,
        recommendedCategory,
      ),
    ],
  };
}

function formatMargin(value) {
  return `${value>=0?'+':''}${value}`;
}

function buildScoreTable(game,options) {
  if(!game.players||game.fortune){
    return null;
  }
  const scores=candidateScores(game);
  const recommendedCategory=(game.pending&&game.pending.type==='category')
    ?game.pending.rec.cat
    :-1;
  const upperRows=[];
  const lowerRows=[];
  for(let category=0;category<5;category++){
    upperRows.push(scoreRow(game,category,scores,options,recommendedCategory));
  }
  for(let category=5;category<8;category++){
    lowerRows.push(scoreRow(game,category,scores,options,recommendedCategory));
  }

  const user=game.players.user;
  const kommy=game.players.kommy;
  return {
    upperRows:upperRows,
    lowerRows:lowerRows,
    fortuneButton:options.canFortune,
    userActivity:game.active==='user'?'act':'',
    kommyActivity:game.active==='kommy'?'act':'',
    /* 列見出し。幅が狭いので、ふたりで対戦では P1／P2 に縮め、読み上げには略さない名前を渡す。 */
    headers:['user','kommy'].map(function(side) {
      return {
        text:players().playerLabel(game.mode,side,{short:true}),
        label:players().playerLabel(game.mode,side),
      };
    }),
    upperRaw:[user.upperRaw,kommy.upperRaw],
    margin:[
      formatMargin(rules.upperMargin(user.categoryScores)),
      formatMargin(rules.upperMargin(kommy.categoryScores)),
    ],
    bonus:[user.bonusAwarded?'+40':'未達',kommy.bonusAwarded?'+40':'未達'],
    total:[user.total,kommy.total],
  };
}

const api={candidateScores,formatMargin,buildScoreTable};
viewmodel.scoreTable=api;

if(typeof module!=='undefined'&&module.exports){
  module.exports=api;
}
})(typeof window!=='undefined'?window:globalThis);

/* ==== js/viewmodel/fortuneTable.js ==== */
(function(root){
'use strict';

const TDX=root.TDX||(root.TDX={});
const viewmodel=TDX.viewmodel||(TDX.viewmodel={});
const rules=root.TD;

function formatProbability(probability) {
  return TDX.text.fmtPct(probability);
}

function faceRow(turn,face) {
  const distribution=rules.faceCountDist(
    turn.redFaces,
    turn.green,
    turn.held,
    face,
  );
  let mostLikelyCount=0;
  for(let count=1;count<=5;count++){
    if(distribution[count]>distribution[mostLikelyCount]){
      mostLikelyCount=count;
    }
  }

  const cells=[];
  for(let count=1;count<=5;count++){
    const probability=distribution[count];
    const text=formatProbability(probability);
    const classes=[];
    if(probability<=0){
      classes.push('zero');
    }
    if(count===mostLikelyCount&&probability>0){
      classes.push('top');
    }
    cells.push({
      classes:classes,
      ariaLabel:`${face} が ${count} 個 ${text}`,
      text:text,
    });
  }
  return {face:face,cells:cells};
}

function roleRows(turn) {
  const probabilities=rules.roleProbs(turn.redFaces,turn.green,turn.held);
  const roles=[
    ['fullHouse',5],
    ['largeStraight',6],
    ['yacht',7],
  ];
  return roles.map(function(role) {
    const probability=probabilities[role[0]];
    const text=formatProbability(probability);
    return {
      key:role[0],
      label:TDX.text.CAT_LABEL[role[1]],
      classes:probability<=0?['zero']:[],
      ariaLabel:`${TDX.text.CAT_SPEECH[role[1]]} ${text}`,
      text:text,
    };
  });
}

function targetRows(distribution) {
  if(!distribution){
    return [];
  }
  return Array.from(distribution,function(probability,category){
    return {
      category:category,
      label:TDX.text.CAT_LABEL[category],
      probability:probability,
      text:formatProbability(probability),
    };
  }).filter(function(row){return row.probability>0;})
    .sort(function(left,right){
      return right.probability-left.probability||left.category-right.category;
    })
    .slice(0,3);
}

function buildFortuneTable(turn,targetDistribution) {
  if(!turn){
    return null;
  }
  const faces=[];
  for(let face=1;face<=6;face++){
    faces.push(faceRow(turn,face));
  }
  return {faces:faces,roles:roleRows(turn),targets:targetRows(targetDistribution)};
}

const api={formatProbability,faceRow,roleRows,targetRows,buildFortuneTable};
viewmodel.fortuneTable=api;

if(typeof module!=='undefined'&&module.exports){
  module.exports=api;
}
})(typeof window!=='undefined'?window:globalThis);

function placeholder(chatState) {
  if(chatState.loading){
    return 'コミーが本を探しています…';

  if(chatState.loaded){

    over:over,
    canSend:chatState.loaded&&text.trim().length>0&&!over,
    placeholder:placeholder(chatState),
    canStop:chatState.streaming,
  };
}

/* ==== js/views/chatOpenAnimation.js ==== */
/* 立ち絵と吹き出しの複製をチャット窓の大きさへ広げる。 */
(function(){
'use strict';

const prefersReducedMotion=(
  window.matchMedia
  &&window.matchMedia('(prefers-reduced-motion: reduce)').matches
);
const FACE_SLIDE_MS=260;
const MODAL_EXPAND_MS=380;
const GHOST_REMOVE_DELAY_MS=140;
const CHAT_MODAL_MAX_WIDTH_PX=440;
const CHAT_MODAL_MAX_HEIGHT_PX=640;
const VIEWPORT_MARGIN_PX=24;
const EASING='cubic-bezier(.2,.8,.2,1)';

function ghostBubble(bounds) {
  const bubble=document.createElement('div');
  const who=document.createElement('div');
  const message=document.createElement('div');
  bubble.className='bubble ghost';
  bubble.setAttribute('aria-hidden','true');
  who.className='who';
  who.textContent='コミー';
  message.className='l1';
  message.textContent='コミーとおしゃべり';
  bubble.appendChild(who);
  bubble.appendChild(message);
  Object.assign(bubble.style,{
    position:'fixed',
    left:bounds.left+'px',
    top:bounds.top+'px',
    width:bounds.width+'px',
    height:bounds.height+'px',
    zIndex:49,
    margin:0,
    pointerEvents:'none',
  });
  return bubble;
}

function ghostFace(faceElement,bounds) {
  const face=document.createElement('div');
  face.className='face ghost-face';
  face.setAttribute('aria-hidden','true');
  face.dataset.expr=faceElement.dataset.expr||'normal';
  face.appendChild(faceElement.querySelector('svg').cloneNode(true));
  Object.assign(face.style,{
    position:'fixed',
    left:bounds.left+'px',
    top:bounds.top+'px',
    width:bounds.width+'px',
    height:bounds.height+'px',
    zIndex:51,
    margin:0,
    pointerEvents:'none',
    transformOrigin:'50% 50%',
  });
  return face;
}

function open(options) {
  const bubbleElement=options.bubbleElement;
  const faceElement=options.faceElement;
  if(!bubbleElement||!faceElement){
    options.onOpen();
    return;
  }

  const bubbleBounds=bubbleElement.getBoundingClientRect();
  const faceBounds=faceElement.getBoundingClientRect();
  if(
    prefersReducedMotion
    ||!bubbleElement.animate
    ||bubbleBounds.width===0
    ||faceBounds.width===0
  ){
    options.onOpen();
    return;
  }

  const modalWidth=Math.min(CHAT_MODAL_MAX_WIDTH_PX,window.innerWidth-VIEWPORT_MARGIN_PX);
  const modalHeight=Math.min(CHAT_MODAL_MAX_HEIGHT_PX,window.innerHeight-VIEWPORT_MARGIN_PX);
  const modalLeft=(window.innerWidth-modalWidth)/2;
  const modalTop=(window.innerHeight-modalHeight)/2;
  const bubbleGhost=ghostBubble(bubbleBounds);
  const faceGhost=ghostFace(faceElement,faceBounds);
  document.body.appendChild(bubbleGhost);
  document.body.appendChild(faceGhost);

  const firstX=(bubbleBounds.left+10)-faceBounds.left;
  const firstY=(bubbleBounds.top+(bubbleBounds.height-faceBounds.height)/2)-faceBounds.top;
  const faceSlide=faceGhost.animate([
    {transform:'translate(0,0) scale(1)'},
    {transform:`translate(${firstX}px,${firstY}px) scale(1.04)`},
  ],{
    duration:FACE_SLIDE_MS,
    easing:EASING,
    fill:'forwards',
  });

  faceSlide.onfinish=function() {
    bubbleGhost.animate([
      {
        left:bubbleBounds.left+'px',
        top:bubbleBounds.top+'px',
        width:bubbleBounds.width+'px',
        height:bubbleBounds.height+'px',
      },
      {
        left:modalLeft+'px',
        top:modalTop+'px',
        width:modalWidth+'px',
        height:modalHeight+'px',
      },
    ],{
      duration:MODAL_EXPAND_MS,
      easing:EASING,
      fill:'forwards',
    });
    const finalX=modalLeft+modalWidth/2-(faceBounds.left+faceBounds.width/2);
    const finalY=modalTop+modalHeight*0.42-(faceBounds.top+faceBounds.height/2);
    const faceExpand=faceGhost.animate([
      {transform:`translate(${firstX}px,${firstY}px) scale(1.04)`,opacity:1},
      {transform:`translate(${finalX}px,${finalY}px) scale(1.9)`,opacity:.3},
    ],{
      duration:MODAL_EXPAND_MS,
      easing:EASING,
      fill:'forwards',
    });
    faceExpand.onfinish=function() {
      options.onOpen();
      setTimeout(function() {
        bubbleGhost.remove();
        faceGhost.remove();
      },GHOST_REMOVE_DELAY_MS);
    };
  };
}

TDX.chatOpenAnimation={open:open};
})();

/* ==== js/views/KommyRow.js ==== */
/* コミーの立ち絵と吹き出しを表示し、チャットと理由の操作を受け取る。 */
(function(){
'use strict';

TV.defineView('KommyRow',{
  template:`
<div class="kommy-row">
  <button
    class="portrait"
    id="portraitSp"
    aria-label="コミーと話す（チャットを開く）"
    @click="onPortrait"
  ><KommyFace
    ref="faceRef"
    :expr="expr"
  /></button>
  <div
    class="bubble"
    id="bubbleSp"
    ref="bubbleRef"
    aria-live="polite"
    :class="{ok:bubble.tone==='ok',warn:bubble.tone==='warn',sad:bubble.tone==='sad'}"
  >
    <div class="who">コミー</div>
    <div class="chipwrap"><span
      v-if="bubble.chip"
      class="chip"
    >{{ bubble.chip }}</span></div>
    <div class="l1">{{ bubble.l1 }}</div>
    <div
      class="l2"
      role="button"
      tabindex="0"
      title="タップで全文を表示"
      :class="{open:bubble.open}"
      :aria-expanded="bubble.open?'true':'false'"
      @click="onReason"
      @keydown.enter.prevent="onReason"
      @keydown.space.prevent="onReason"
    >{{ bubble.l2 }}</div>
    <div
      class="l2hint"
      aria-hidden="true"
      @click="onReason"
    >▼ タップで全文</div>
  </div>
</div>`,
  setup:function() {
    const userInterface=TV.useStore('ui');
    const director=TV.useStore('director');
    const game=TV.useStore('game');
    const faceRef=TV.ref(null);
    const bubbleRef=TV.ref(null);

    function onPortrait(event) {
      if(game.phase==='loading'){
        return;
      }
      const opener=event.currentTarget;
      const faceElement=faceRef.value&&faceRef.value.$el;
      TDX.chatOpenAnimation.open({
        bubbleElement:bubbleRef.value,
        faceElement:faceElement,
        onOpen:function() {
          director.openChat(opener);
        },
      });
    }

    return {
      faceRef:faceRef,
      bubbleRef:bubbleRef,
      bubble:TV.computed(function() {
        return userInterface.state.bubble;
      }),
      expr:TV.computed(function() {
        return userInterface.state.expr;
      }),
      onPortrait:onPortrait,
      onReason:function() {
        director.toggleReason();
      },
    };
  },
});
})();

/* ==== js/views/Scorecard.js ==== */
/* 得点表とうらない表を切り替え、表全体に関わる演出と操作を引き受ける。 */
(function(){
'use strict';

const prefersReducedMotion=(
  window.matchMedia
  &&window.matchMedia('(prefers-reduced-motion: reduce)').matches
);
const SHINE_FOCUS_DELAY_MS=250;
const SHINE_DURATION_MS=560;
const BONUS_HELP=(
  '上段余裕 B ＝ 5 ＋ Σ(記録済み上段の得点 − 3×目)。'
  +'B が 0 以上なら「各目 3 個」基準で 55 点に届く圏内。'
);

TV.defineView('Scorecard',{
  template:`
<div
  class="scorecard inline"
  id="cardSp"
  ref="cardRef"
  @click="onClick"
>
  <FortuneTable
    v-if="fortune"
    :model="fortune"
  />
  <ScoreTable
    v-else-if="score"
    :model="score"
  />
</div>`,
  setup:function() {
    const game=TV.useStore('game');
    const userInterface=TV.useStore('ui');
    const director=TV.useStore('director');
    const canFortune=TDX.game.canFortune;
    const scoreTable=TDX.viewmodel.scoreTable;
    const fortuneTable=TDX.viewmodel.fortuneTable;
    const cardRef=TV.ref(null);

    TV.watch(function() {
      return canFortune();
    },function(canShowFortune) {
      if(!canShowFortune){
        game.fortune=false;
      }
    });

    /* 光を途中まで走らせてから、切り替わった側のボタンへ焦点を移す。 */
    TV.watch(function() {
      return userInterface.state.fortuneFx.seq;
    },function() {
      const card=cardRef.value;
      const focusButton=function() {
        userInterface.focusLater('#btnFortune');
      };
      if(prefersReducedMotion||!card){
        focusButton();
        return;
      }
      card.classList.remove('shine');
      void card.offsetWidth;
      card.classList.add('shine');
      clearTimeout(card._shineFocusTimer);
      clearTimeout(card._shineEndTimer);
      card._shineFocusTimer=setTimeout(focusButton,SHINE_FOCUS_DELAY_MS);
      card._shineEndTimer=setTimeout(function() {
        card.classList.remove('shine');
      },SHINE_DURATION_MS);
    },{flush:'post'});

    const score=TV.computed(function() {
      return scoreTable.buildScoreTable(game,{
        flash:userInterface.state.flash,
        canSelect:TDX.game.canSelect(),
        canFortune:canFortune(),
        breakdowns:userInterface.state.scoreBreakdowns||(
          game.pending&&game.pending.facts&&game.pending.facts.breakdowns
        )||null,
      });
    });

    const fortune=TV.computed(function() {
      if(!game.players||!game.fortune||!game.turn){
        return null;
      }
      const context=userInterface.state.fortuneContext;
      return fortuneTable.buildFortuneTable(
        context&&context.turn?context.turn:game.turn,
        context&&context.targetDistribution,
      );
    });

    function focusCategory(category) {
      TV.nextTick(function() {
        const selector=`#cardSp [data-cat="${category}"]`;
        const candidate=document.querySelector(selector);
        if(candidate){
          candidate.focus();
        }
      });
    }

    function onClick(event) {
      if(event.target.closest('[data-q="B"]')){
        userInterface.toast(BONUS_HELP);
        return;
      }
      const candidate=event.target.closest('button.cand');
      if(candidate&&!candidate.disabled&&!candidate.classList.contains('kommy')){
        const category=Number(candidate.dataset.cat);
        director.userSelectCat(category);
        focusCategory(category);
        return;
      }
      if(event.target.closest('#btnRegister')){
        director.userRegister();
        return;
      }
      if(event.target.closest('#btnFortune')){
        director.toggleFortune();
      }
    }

    return {
      score:score,
      fortune:fortune,
      cardRef:cardRef,
      onClick:onClick,
    };
  },
});
})();

/* ==== js/views/Modal.js ==== */
/* 窓の開閉に合わせて、窓の内外へ焦点を移す。 */
(function(){
'use strict';

const FOCUSABLE='button:not([disabled]),textarea,[tabindex="0"]';

TV.defineView('Modal',{
  props:{
    id:{type:String,required:true},
    labelledby:{type:String,default:''},
  },
  template:`
<div class="overlay" :id="id" role="dialog" aria-modal="true" :aria-labelledby="labelledby"
  :class="{hidden:!open}"><slot/></div>`,
  setup:function(props){
    const uiStore=TV.useStore('ui');
    const open=TV.computed(function(){
      return uiStore.modalOpen(props.id);
    });
    let opener=null;

    TV.watch(open,function(isOpen){
      if(isOpen){
        opener=uiStore.modalOpener(props.id);
        const modalElement=document.getElementById(props.id);
        const firstFocusable=modalElement&&modalElement.querySelector(FOCUSABLE);
        if(firstFocusable){
          firstFocusable.focus();
        }
        return;
      }
      const previousOpener=opener;
      opener=null;
      if(previousOpener&&previousOpener.focus){
        try{
          previousOpener.focus();
        }catch(error){
          /* 外された要素へは焦点を戻せない。 */
        }
      }
    },{flush:'post'});

    return {open:open};
  },
});
})();

/* ==== js/views/TitleScreen.js ==== */
/* タイトルの対戦モードと、コミーの顔に対する操作・演出をまとめる。 */
(function(){
'use strict';

const prefersReducedMotion=(
  window.matchMedia
  &&window.matchMedia('(prefers-reduced-motion: reduce)').matches
);

function squash(faceElement) {
  if(prefersReducedMotion){
    return;
  }
  faceElement.classList.remove('squash');
  void faceElement.offsetWidth;
  faceElement.classList.add('squash');
  clearTimeout(faceElement._squashTimer);
  faceElement._squashTimer=setTimeout(function() {
    faceElement.classList.remove('squash');
  },120);
}

/* ハートは見た目だけの演出なので Math.random を使う（試合の乱数列 G.rng には触れない） */
function spawnHearts(faceElement) {
  const heartCount=5+Math.floor(Math.random()*4);
  for(let index=0;index<heartCount;index++){
    const heart=document.createElement('span');
    const isLeft=index%2===0;
    heart.className='heart';
    heart.textContent='♥';
    heart.setAttribute('aria-hidden','true');
    heart.style.left=(isLeft?2+Math.random()*18:80+Math.random()*18)+'%';
    heart.style.top=(30+Math.random()*45)+'%';
    heart.style.fontSize=(8+Math.random()*4).toFixed(1)+'px';
    heart.style.setProperty('--hx',(Math.random()*16-8).toFixed(1)+'px');
    heart.style.setProperty('--hy',(-(40+Math.random()*40)).toFixed(1)+'px');
    faceElement.appendChild(heart);
    setTimeout(function() {
      heart.remove();
    },prefersReducedMotion?600:900);
  }
}

TV.defineView('TitleScreen',{
  template:`
<section
  class="screen title-screen"
  id="scrTitle"
  :class="{hidden:!visible}"
>
  <h1 class="logo"><img
    class="title-img"
    alt="トリカヨットスクール"
    :src="titleImg"
  ></h1>
  <KommyFace
    class="face-title"
    ref="faceRef"
    :expr="expr"
    @pointerdown="onPointerDown"
    @pointermove="onPointerMove"
    @pointerup="onPointerUp"
    @pointercancel="onPointerCancel"
  />
  <div class="acts">
    <div class="act-with-note">
      <button
        class="btn-primary"
        id="btnStart"
        :data-mode="startMode"
        :aria-describedby="showsNote?'pvpNote':null"
        @click="onStart"
      >{{ startText }}</button>
      <small
        v-if="showsNote"
        id="pvpNote"
        class="mode-note"
      >このモードだけ音声あり</small>
    </div>
    <button
      id="btnHowto"
      @click="onHowto"
    >遊び方</button>
    <button
      id="btnSecond"
      :data-mode="secondMode"
      @click="onSecond"
    >{{ secondText }}</button>
  </div>
</section>`,
  setup:function() {
    const game=TV.useStore('game');
    const userInterface=TV.useStore('ui');
    const director=TV.useStore('director');
    const sound=TV.useStore('sound');
    const gestureRules=TDX.viewmodel.faceGesture;
    /* 気分ごとのボタンの並び・注記・表情（viewmodel/titleMood.js） */
    const buttons=TV.computed(function() {
      return TDX.viewmodel.titleMood.titleButtons(game.mood);
    });
    const faceRef=TV.ref(null);

    /* 店が置いた合図を見て顔を動かす。要素はこの部品の物なので ref から取る。 */
    TV.watch(function() {
      return userInterface.state.titleFx.seq;
    },function() {
      const faceElement=faceRef.value&&faceRef.value.$el;
      if(!faceElement){
        return;
      }
      if(userInterface.state.titleFx.kind==='squash'){
        squash(faceElement);
      }else{
        spawnHearts(faceElement);
      }
    },{flush:'post'});

    let gesture=null;

    /* ふたりで対戦だけは音を鳴らす。自動再生の制限を越えるため、クリック処理の中で音の文脈を起こし、
       試合（mode）を始めてから開始音を鳴らす（先に鳴らすと、指導ありのまま検査で止められる）。 */
    function startMatch(mode) {
      if(mode==='pvp'){
        sound.unlock();
      }
      director.newMatch(director.debugSeed(),mode);
      sound.play('se_start');
    }

    function onPointerDown(event) {
      gesture=gestureRules.start(event.pointerId,event.clientX);
      try{
        event.currentTarget.setPointerCapture(event.pointerId);
      }catch(error){
        /* Pointer Capture 非対応でも、後続イベントが届く範囲では操作できる。 */
      }
    }

    function onPointerMove(event) {
      const faceWidth=event.currentTarget.getBoundingClientRect().width;
      const moved=gestureRules.move(gesture,event,faceWidth);
      gesture=moved.gesture;
      if(moved.command==='pet'){
        director.petFace();
      }
    }

    function onPointerUp(event) {
      if(!gesture||gesture.pointerId!==event.pointerId){
        return;
      }
      const finished=gestureRules.finish(gesture,{
        pointerId:event.pointerId,
        clientX:event.clientX,
        clientY:event.clientY,
        viewportWidth:window.innerWidth,
        viewportHeight:window.innerHeight,
      });
      gesture=finished.gesture;
      try{
        event.currentTarget.releasePointerCapture(event.pointerId);
      }catch(error){
        /* Pointer Capture 非対応時は解放も不要である。 */
      }
      if(finished.command==='hit'){
        director.hitFace();
      }
    }

    function onPointerCancel(event) {
      gesture=gestureRules.cancel(gesture,event.pointerId);
    }

    return {
      faceRef:faceRef,
      titleImg:window.TDX.titleImg,
      visible:TV.computed(function() {
        return game.phase==='title';
      }),
      expr:TV.computed(function() {
        return buttons.value.expr;
      }),
      startText:TV.computed(function() {
        return buttons.value.primary.text;
      }),
      startMode:TV.computed(function() {
        return buttons.value.primary.mode;
      }),
      secondText:TV.computed(function() {
        return buttons.value.secondary.text;
      }),
      secondMode:TV.computed(function() {
        return buttons.value.secondary.mode;
      }),
      showsNote:TV.computed(function() {
        return buttons.value.showsSoundNote;
      }),
      onStart:function() {
        startMatch(buttons.value.primary.mode);
      },
      onSecond:function() {
        startMatch(buttons.value.secondary.mode);
      },
      onHowto:function() {
        director.openHowto();
      },
      onPointerDown:onPointerDown,
      onPointerMove:onPointerMove,
      onPointerUp:onPointerUp,
      onPointerCancel:onPointerCancel,
    };
  },
});
})();
