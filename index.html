<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>トリカヨットスクール</title>
<style>

/* ==== css/base.css ==== */
:root{
  --bg:#fbf6ef; --panel:#ffffff; --panel2:#fff3f1; --ink:#4a3535; --muted:#8c7373; --line:#ead9d6;
  --pink:#f7d9dc; --pink2:#f2b9c0; --brown:#8c4a4a; --cream:#fbf0dc;
  --red:#d9474f; --red-dark:#a12f36; --green:#3fa34d; --green-dark:#2b7a37;
  --ok:#3f8f5a; --ok-bg:#e6f4ea; --warn:#d98b2b; --warn-bg:#fff1dc; --focus:#2f6fd6;
  --radius:14px; --shadow:0 4px 14px rgba(120,70,70,.10);
}
/* 怒っているあいだの配色（灰みの薄紫）。body[data-mood] は app.js の applyMood() が付け外しする */
body[data-mood="angry"]{--bg:#efe6f2;--pink:#e5cde9;--panel2:#f6effa}
/* ごきげん（タイトル）とふたりで対戦（試合・結果）の配色（薄い黄色）。仕様書 21.2 */
body[data-mood="pleased"]{--bg:#fff6cc;--pink:#f8e7a3;--panel2:#fffbe8}
body,#app{transition:background-color .3s}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-size:16px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px;min-width:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:8px 14px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn-primary{background:var(--brown);color:#fff;border-color:var(--brown);font-weight:700}
.btn-primary:not(:disabled):hover{filter:brightness(1.08)}
.btn-accent{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.btn-ok{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.btn-warn{background:var(--warn);color:#fff;border-color:var(--warn);font-weight:700}
.btn-small{min-height:36px;min-width:36px;padding:4px 10px;font-size:.9rem}
.hidden{display:none!important}
/* hidden 属性は UA の規則なので、.badge などの display 指定に負ける。明示して勝たせる */
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app shell ---------- */
#app{height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:nowrap;min-height:52px}
.topbar .title{font-weight:800;letter-spacing:.04em;white-space:nowrap}
.topbar .status{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar .totals{display:flex;gap:10px;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.95rem}
.topbar .totals b{font-size:1.05rem}
.topbar .menu{display:flex;gap:6px}

/* ---------- game layout ---------- */
.game{display:grid;gap:10px;padding:10px;flex:1;min-height:0}
.col{min-height:0;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.center{display:flex;flex-direction:column;gap:8px;min-height:0}
.board{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:10px;overflow:auto}
.board>*{flex-shrink:0}
.advice-open .controls,.advice-open .hintline{display:none}
.roundline{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:0 4px}
.roundline .rolls{color:var(--muted);font-weight:600}
/* ガチ対戦の札（ダイスの直上。flex の列なので align-self で中央に置く） */
.mode-tag{align-self:center;background:#e5cde9;color:#5e17eb;font-weight:800;font-size:.85rem;letter-spacing:.06em;padding:2px 12px;border-radius:999px;line-height:1.4}
@media (max-height:600px){.mode-tag{font-size:.75rem;padding:1px 10px;letter-spacing:.04em}}
.mode-tag[data-mode="pvp"]{background:#f8e7a3;color:#7a4f00}
/* 音のボタン。音なしは斜線と薄さでも示す（色だけに頼らない） */
.sound-btn.muted{text-decoration:line-through;opacity:.6}
.dice{display:flex;justify-content:center;gap:10px;flex-wrap:nowrap;padding:12px 6px;background:var(--cream);border-radius:var(--radius)}
.dslot{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 1 auto}
.die{--sz:min(64px,14vw);width:var(--sz);height:var(--sz);border-radius:22%;border:none;padding:calc(var(--sz)*.13);min-width:0;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;background:var(--red);box-shadow:0 4px 0 var(--red-dark),0 6px 12px rgba(0,0,0,.18);transition:transform .15s;position:relative;-webkit-tap-highlight-color:transparent}
.die.green{background:var(--green);box-shadow:0 4px 0 var(--green-dark),0 6px 12px rgba(0,0,0,.18)}
.die[aria-pressed="true"]{transform:translateY(-8px);outline:3px solid #e2a400;outline-offset:2px}
.die.blank{background:#d9ccc9;box-shadow:0 4px 0 #bfaeab}
.die.blank.green{background:#bcd9c0;box-shadow:0 4px 0 #93b699}
.die.rolling{animation:tumble .12s infinite alternate}
.die.rec-keep{box-shadow:0 0 0 4px #ffd766,0 4px 0 var(--red-dark),0 6px 12px rgba(0,0,0,.18)}
.die.green.rec-keep{box-shadow:0 0 0 4px #ffd766,0 4px 0 var(--green-dark),0 6px 12px rgba(0,0,0,.18)}
.die.rec-roll{opacity:.45}
@keyframes tumble{from{transform:rotate(-8deg) scale(.96)}to{transform:rotate(8deg) scale(1.04)}}
.pip{width:100%;height:100%;border-radius:50%;background:#fff;opacity:0;box-shadow:inset 0 -1px 2px rgba(0,0,0,.25)}
.pip.on{opacity:1}
.die svg.elf{grid-column:1/4;grid-row:1/4;width:100%;height:100%}
.die .wtxt{grid-column:1/4;grid-row:1/4;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:calc(var(--sz)*.5)}
.dlabel{font-size:.7rem;font-weight:700;color:var(--muted);min-height:26px;line-height:1.15;text-align:center}
.dlabel.tap{font-size:.62rem;color:#1d5f9e;font-weight:600}
.die.free{animation:sway 2.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*-0.45s)}
@keyframes sway{0%,100%{transform:rotate(-5deg) translateX(-3px)}50%{transform:rotate(5deg) translateX(3px)}}
.dlabel.keep{color:#b07a12}
.dlabel.hint{color:#1d5f9e}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.controls button{flex:1 1 150px;max-width:420px;font-size:1.05rem}
.hintline{text-align:center;color:var(--muted);font-size:.9rem;min-height:1.3em}

/* advice panel */
.advice{border-radius:var(--radius);padding:10px 12px;border:2px solid var(--warn);background:var(--warn-bg)}
.advice.ok{border-color:var(--ok);background:var(--ok-bg)}
.advice .chip{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff;border:1px solid var(--warn);color:#8a5410;margin-bottom:4px}
.advice p{margin:2px 0}
.advice .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.advice .acts button{flex:1 1 140px}

/* ---------- scorecard (combined: 役 | あなた | コミー) ---------- */
.scorecard{padding:6px;overflow:auto;min-height:0}
.scorecard table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;table-layout:fixed}
.scorecard col.c1{width:46%}
.scorecard th{font-size:.8rem;color:var(--muted);font-weight:700;padding:2px 4px;border-bottom:2px solid var(--line);text-align:center}
.scorecard th.n{text-align:left}
.scorecard th.act{color:var(--red);background:#fff3f1}
.scorecard td{padding:1px 4px;border-bottom:1px solid var(--line);font-size:.9rem;height:30px}
.scorecard td.n{font-weight:700;white-space:nowrap;text-align:left;width:50%;font-size:.86rem;padding-right:2px}
.scorecard td.n .nwrap{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.scorecard tr.selrow td{background:#fff8e6}
.scorecard .regbtn{flex:0 0 auto;min-width:34px;min-height:26px;padding:0 5px;border-radius:8px;background:var(--brown);color:#fff;border-color:var(--brown);font-weight:800;font-size:.78rem;margin-left:auto}
.scorecard td.n .ico{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;background:var(--red);color:#fff;font-size:.75rem;font-weight:800;margin-right:4px;padding:0 4px}
.scorecard td.n .ico.l{background:#b58a8a;font-size:.72rem;padding:0 6px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.scorecard td.v{text-align:center;padding:1px 2px}
.scorecard td.v.empty{color:#c9b3b3}
.scorecard td.v .cand{display:inline-block;width:100%;min-height:28px;min-width:0;padding:0 4px;border-radius:8px;border:1px dashed #cfb5b5;background:#fff;color:#a08080;font-weight:600;text-align:center;font-size:.9rem;line-height:1.2}
.scorecard td.v .cand:not(:disabled):hover{background:var(--cream)}
.scorecard td.v .cand[aria-pressed="true"]{border:2px solid #e2a400;background:#fff6d6;color:var(--ink);font-weight:800}
.scorecard td.v .cand.rec{box-shadow:0 0 0 3px #ffd766}
.scorecard td.v .cand.kommy{cursor:default;border-style:dotted}
.scorecard td.v .cand.kommy[aria-pressed="true"]{border:2px solid var(--ok);background:var(--ok-bg);color:var(--ink);font-weight:800}
.scorecard td.v .cand .breakdown{display:block;font-size:.58rem;line-height:1.05;font-weight:600;color:var(--muted);white-space:nowrap}
.scorecard td.v.done{font-weight:800}
.scorecard td.v.done.zero{color:#b26a6a;font-weight:600}
.scorecard tr.sec td{background:#f6ebe9;color:var(--brown);font-size:.72rem;font-weight:700;height:20px;padding:0 6px;letter-spacing:.04em}
.scorecard tr.sub td{background:#fbf5f3;font-size:.82rem;color:#6b4f4f;height:24px}
.scorecard tr.sub td.v{font-weight:700}
.scorecard .mini{font-weight:400;font-size:.72rem;color:var(--muted)}
.scorecard tr.total td{background:var(--pink);font-weight:800;font-size:1rem;border-bottom:none;height:32px}
/* アリスのうらない（タロットの札ボタンと確率表） */
.scorecard th.n .hwrap{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.scorecard .fortunebtn{flex:0 1 auto;display:inline-flex;align-items:center;gap:3px;min-width:0;min-height:26px;padding:0 6px;border-radius:8px;background:#f5ecff;border:1px solid #c9a6ee;color:#5e17eb;font-weight:800;font-size:.72rem;white-space:nowrap;line-height:1}
@media (max-width:359px){.scorecard .fortunebtn{font-size:.66rem;padding:0 4px;gap:2px}}
.scorecard .fortunebtn:not(:disabled):hover{background:#ecdcff}
.scorecard .fortunebtn.on{background:#5e17eb;border-color:#5e17eb;color:#fff}
.scorecard .fortunebtn .icon{font-size:.9rem}
.scorecard table.fortune thead th.n{padding:2px 4px 3px;border-bottom:none}
.scorecard table.fortune tr.cnt th{font-size:.78rem;color:var(--muted);font-weight:700;padding:3px 0;background:#fbf5f3;border-bottom:1px solid var(--line);text-align:center;height:24px}
.scorecard table.fortune tr.cnt th.n{text-align:left;padding-left:6px;font-size:.72rem}
.scorecard table.fortune tr.sec td{white-space:normal;font-size:.68rem;letter-spacing:0;line-height:1.25;height:auto;padding:3px 6px}
.scorecard table.fortune td{height:32px}
.scorecard table.fortune td.v.p{font-size:.92rem;padding:1px 0;color:#6b4f4f;overflow:hidden;letter-spacing:.01em}
@media (max-width:359px){.scorecard table.fortune td.v.p{font-size:.82rem}}
.scorecard table.fortune td.v.p.zero{color:#c9b3b3}
.scorecard table.fortune td.v.p.role{text-align:left;padding-left:12px;font-weight:800;color:var(--ink)}
.scorecard table.fortune td.v.p.role.zero{font-weight:600;color:#c9b3b3}
.scorecard table.fortune td.v.p.top{font-weight:800;color:var(--ink);background:#fff8e6}
.scorecard{position:relative}
/* 光の帯は transform でなく背景位置で動かす（transform だと overflow:auto の領域が横に広がる） */
/* 帯の幅は要素幅の 0.5 倍（画像 250% の 40〜60%）。位置 100% で帯が左端の外、0% で右端の外に来る */
.scorecard.shine::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.9) 50%,rgba(255,255,255,0) 60%) no-repeat;background-size:250% 100%;background-position:100% 0;animation:shine .5s ease-in-out forwards}
@keyframes shine{from{background-position:100% 0}to{background-position:0% 0}}
.scorecard .qbtn{min-width:20px;min-height:20px;padding:0;border-radius:50%;font-size:.7rem;line-height:18px;margin-left:2px;vertical-align:middle}
.scorecard td.flash{animation:flash 1s ease-out}
@keyframes flash{0%{background:#fff0a0}100%{background:transparent}}
.scorecard.inline{padding:2px 0 0}
.scorecard.inline td{height:26px;font-size:.86rem}
.scorecard.inline td.v .cand{min-height:26px;font-size:.86rem}
.scorecard.inline tr.sec td{height:18px}
.scorecard.inline tr.sub td{height:22px}
.scorecard.inline tr.total td{height:28px}

/* ---------- icons (sprite defined at top of <body>) ---------- */
.icon-defs{position:absolute;width:0;height:0;overflow:hidden}
.icon{display:inline-block;flex:none;vertical-align:-.2em;fill:currentColor}
.icon-tarot{width:1em;height:1.5em}
/* ---------- kommy ---------- */
.kommy{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0;padding:8px}
.portrait{border:none;background:transparent;padding:0;min-height:0;border-radius:16px;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;max-height:100%}
.portrait:hover .face{filter:brightness(1.04)}
.face{display:flex;align-items:center;justify-content:center;max-height:100%;max-width:100%}
.face svg{display:block;width:100%;height:100%;max-height:100%}
.portrait .face{width:100%;height:100%}
.face-title{width:min(260px,60vw);height:auto;margin:0 auto}
/* タイトルの顔は叩く・なでるの対象。横になぞってもページが動かないよう touch-action を切る */
#scrTitle .face-title{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;-webkit-tap-highlight-color:transparent}
#scrTitle .face-title.squash{animation:squash .12s ease-out}
@keyframes squash{0%{transform:scale(1,1)}50%{transform:scale(1.1,.84)}100%{transform:scale(1,1)}}
.heart{position:absolute;color:#f08ca6;line-height:1;pointer-events:none;z-index:2;animation:heartUp .9s ease-out forwards}
@keyframes heartUp{0%{opacity:0;transform:translate(0,0) scale(.7)}15%{opacity:1}100%{opacity:0;transform:translate(var(--hx,0),var(--hy,-60px)) scale(1.15)}}
.face-title svg{height:auto}
/* expressions: parts use transform-box so CSS transforms pivot on the part itself */
.kommy-svg .p-eyes,.kommy-svg .p-mouth,.kommy-svg .p-brows,.kommy-svg .p-ahoge,.kommy-svg .p-cheeks{transform-box:fill-box;transform-origin:center;transition:transform .25s ease,opacity .25s ease}
.kommy-svg .p-ahoge{transform-origin:50% 100%}
.face[data-expr="happy"] .p-eyes{transform:scaleY(.22) translateY(6px)}
.face[data-expr="happy"] .p-mouth{transform:translateY(-3px) scale(1.15)}
.face[data-expr="happy"] .p-ahoge{animation:wag .5s ease-in-out 2}
.face[data-expr="think"] .p-eyes{transform:scaleY(.7) translateY(3px)}
.face[data-expr="think"] .p-brows{transform:translateY(-4px)}
.face[data-expr="think"] .p-mouth{transform:scale(.8)}
.face[data-expr="oops"] .p-eyes{transform:scale(1.15)}
.face[data-expr="oops"] .p-brows{transform:translateY(-8px) rotate(-3deg)}
.face[data-expr="oops"] .p-mouth{transform:scaleY(.5) translateY(-6px)}
.face[data-expr="sad"] .p-brows{transform:translateY(4px) rotate(4deg)}
.face[data-expr="sad"] .p-eyes{transform:scaleY(.45) translateY(6px)}
.face[data-expr="sad"] .p-mouth{transform:scaleY(.6) translateY(-4px)}
.face[data-expr="sad"] .p-ahoge{transform:rotate(-25deg)}
/* 怒り：眉を下げ、目を細め、口を平らにする（眉は 1 グループなので下げて縮める） */
.face[data-expr="angry"] .p-brows{transform:translateY(6px) scaleY(.85)}
.face[data-expr="angry"] .p-eyes{transform:scaleY(.6) translateY(4px)}
.face[data-expr="angry"] .p-mouth{transform:scaleY(.35)}
.face[data-expr="talk"] .p-mouth{animation:talk .35s ease-in-out infinite alternate}
.face[data-expr="talk"] .p-eyes{transform:scaleY(.85)}
@keyframes wag{0%{transform:rotate(0)}50%{transform:rotate(14deg)}100%{transform:rotate(0)}}
@keyframes talk{from{transform:scaleY(.55) translateY(-4px)}to{transform:scaleY(1.05)}}
.bubble{width:100%;background:#fff;border:2px solid var(--pink2);border-radius:14px;padding:8px 10px;position:relative;font-size:.95rem}
.bubble.ghost{background:var(--panel);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.ghost-face svg{width:100%;height:100%}
/* チャットの背後で薄く浮かぶコミー */
.chat-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
.chat-bg .face{width:min(78vw,560px);opacity:.3;animation:bob 4.2s ease-in-out infinite}
.chat-bg .face svg{width:100%;height:auto}
.modal.chat{background:rgba(255,255,255,.9)}
.chat .clog{background:rgba(251,246,239,.72)}
.chat .cinput,.chat .cnt,.chat .topics{background:rgba(255,255,255,.85)}
.bubble .who{font-size:.75rem;color:var(--muted);font-weight:700}
.bubble .chip{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--pink);color:var(--brown);margin:2px 0}
.bubble .l1{font-weight:700}
.bubble .l2{color:#6b4f4f;border-top:1px dashed var(--line);margin-top:4px;padding-top:4px}
.bubble .l2:empty{display:none}
.bubble .l2hint{display:none;color:var(--muted);font-size:.72rem;text-align:right;cursor:pointer;line-height:1.2}
.bubble.ok{border-color:var(--ok)}
.bubble.warn{border-color:var(--warn)}
.tapnote{font-size:.75rem;color:var(--muted)}

/* ---------- single vertical layout (phone-like column; centered and fixed-width on wide screens) ---------- */
.game{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);gap:8px;padding:8px}
.kommy-row{display:flex;gap:8px;align-items:stretch;min-height:0;padding:2px 0}
.kommy-row .portrait{flex:0 0 auto;width:min(26vw,136px);height:auto;max-height:136px;align-items:flex-start;overflow:visible;border-radius:12px;align-self:flex-start}
.kommy-row .portrait .face,.face-title{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.kommy-row .portrait .face{width:100%;height:auto}
.kommy-row .portrait .face svg{height:auto}
.kommy-row .bubble{flex:1;overflow:visible;max-height:none;font-size:.92rem;padding:6px 8px}
.advice-open .kommy-row .bubble .l2{display:none}
.board{justify-content:flex-start;gap:8px;padding:8px}
.advice{padding:8px 10px;font-size:.92rem}
.roundline{flex-wrap:wrap;gap:4px 8px;font-size:.9rem}
.roundline .menu{margin-left:auto;display:flex;gap:4px}
.roundline .kommy-quiet{display:inline-flex;align-items:center;gap:4px;min-height:30px;font-size:.72rem;font-weight:700;color:var(--muted);white-space:nowrap;cursor:pointer}
.roundline .kommy-quiet input{width:18px;height:18px;margin:0;accent-color:var(--brown)}
.roundline .kommy-quiet-short{display:none}
.roundline .menu .btn-small{min-width:34px;min-height:30px;padding:0 8px;font-size:.85rem}
@media (min-width:600px){
  body{background:#efe3df}
  #app{max-width:440px;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(90,40,40,.15)}
  .kommy-row .portrait{width:120px}
}
@media (max-height:600px){
  .kommy-row .portrait{max-height:96px;width:min(18vw,80px)}
  .kommy-row .bubble{font-size:.88rem}
  /* 理由の行は先頭 1 行＋「…」に折り畳み、タップで展開（96px の上限で枠の外へはみ出していたのをやめた） */
  .kommy-row .bubble .l2:not(.open){display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .kommy-row .bubble .l2:not(.open):not(:empty)+.l2hint{display:block}
  .kommy-row .bubble .l2.open{cursor:pointer}
  .dice{padding:6px}
  .die{--sz:min(52px,12vw)}
  .board{gap:6px;padding:6px}
  .topbar{min-height:44px;padding:2px 8px}
}
@media (max-height:520px) and (orientation:landscape) and (max-width:1099px){
  .pc-only{display:none!important}
  .game{grid-template-columns:minmax(200px,1fr) minmax(0,1.6fr);grid-template-rows:minmax(0,1fr);gap:6px;padding:6px}
  .kommy-row{grid-column:1;grid-row:1;flex-direction:column;min-height:0}
  .kommy-row .portrait{display:none}
  .kommy-row .bubble{max-height:none;flex:1;min-height:0}
  .center{grid-column:2;grid-row:1;gap:4px}
  .board{padding:6px;gap:4px;justify-content:flex-start}
  .roundline{font-size:.85rem}
  .roundline .rolls{font-size:.72rem}
  .roundline .menu{gap:2px}
  .roundline .kommy-quiet{gap:1px;font-size:.58rem;min-height:28px}
  .roundline .kommy-quiet input{width:14px;height:14px}
  .roundline .kommy-quiet-full{display:none}
  .roundline .kommy-quiet-short{display:inline}
  .roundline .menu .btn-small{min-width:26px;min-height:28px;padding:0 4px}
  .hintline{display:none}
  .dice{padding:4px}
  .die{--sz:min(46px,9vw)}
  .dlabel{min-height:12px;line-height:12px;font-size:.62rem}
  .controls button{min-height:38px;font-size:.95rem;padding:4px 10px}
  .advice{padding:4px 8px;font-size:.85rem}
  .advice .acts button{min-height:36px}
  .topbar{min-height:40px;padding:0 8px}
}
@media (min-width:900px) and (orientation:landscape) and (max-height:640px){
  .scorecard td{padding:1px 4px;font-size:.85rem}
  .kommy-col .kommy{min-height:60px}
}

/* ---------- overlays / modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(70,40,40,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.modal{background:var(--panel);border-radius:18px;max-width:440px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;padding:18px 18px 14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin:0 0 8px;font-size:1.35rem}
.modal h3{margin:12px 0 4px;font-size:1rem;color:var(--brown)}
.modal p,.modal li{margin:4px 0;font-size:.95rem}
.modal ul{padding-left:1.2em;margin:4px 0}
.modal .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.modal table{width:100%;border-collapse:collapse;font-size:.9rem}
.modal td,.modal th{border:1px solid var(--line);padding:4px 6px;text-align:left}
.modal th{background:var(--pink)}
.modal td.num,.modal th.num{text-align:right;font-variant-numeric:tabular-nums}
.title-screen{align-items:center;justify-content:center;padding:16px;text-align:center;gap:14px;overflow:auto}
.title-screen h1{margin:0;font-size:2rem;letter-spacing:.05em}
.title-screen .lead{max-width:520px;margin:0 auto}
.title-screen .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
/* 「ふたりで対戦」の真下に注記を置く。ほかのボタンは上端で揃えて注記の分だけ下がらない */
.title-screen .act-with-note{display:flex;flex-direction:column;align-items:center}
.title-screen .mode-note{font-size:.75rem;color:var(--brown);margin-top:4px;line-height:1.3;font-weight:400}
.title-screen .logo{margin:0}
.title-img{width:min(400px,86vw);height:auto;display:block;margin:0 auto}
.title-screen .face-title{max-height:30dvh}
.title-screen .face-title svg{max-height:34dvh;width:auto}
.progress{width:min(360px,90%);height:10px;border-radius:999px;background:#eadcd9;overflow:hidden;margin:0 auto}
.progress div{height:100%;width:0;background:var(--ok);transition:width .2s}
.result h2{text-align:center;font-size:2rem;margin-bottom:4px}
/* 負けたときのおすすめ動画（仕様書 22 章）。文字のリンクだけで、外部の画像は読まない */
.result .recommend{margin:12px 0 0;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;background:var(--panel2);font-size:.9rem;line-height:1.5;overflow-wrap:anywhere}
.result .recommend-label{display:block;font-size:.75rem;font-weight:800;color:var(--brown)}
.result .recommend a{color:var(--brown);text-decoration:underline}
.result .big{display:flex;justify-content:center;gap:28px;font-size:1.3rem;font-weight:800;margin:6px 0}
.result .big span{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.result .stat{text-align:center;background:var(--ok-bg);border-radius:10px;padding:6px;margin:6px 0}
.result .restitle{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.result .restitle h2{margin-bottom:0}
.badge{display:inline-block;background:var(--brown);color:#fff;font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.04em}
.badge[data-mode="pvp"]{background:#f8e7a3;color:#7a4f00}
#shareBox{display:block;width:100%;margin-top:10px;font:inherit;font-size:.85rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--cream);color:var(--ink);resize:none}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:min(640px,calc(100dvh - 24px));max-height:calc(100dvh - 24px);padding:0;overflow:hidden}
.chat .chead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chat .chead h2{margin:0;font-size:1.1rem;flex:1}
.chat .clog{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.chat .msg{flex-shrink:0;max-width:88%;padding:8px 12px;border-radius:14px;font-size:.95rem;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.chat .msg.user{align-self:flex-end;background:var(--brown);color:#fff;border-bottom-right-radius:4px}
.chat .msg.kommy{align-self:flex-start;background:#fff;border:1px solid var(--pink2);border-bottom-left-radius:4px}
.chat .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:.85rem}
/* 盤面のコミー列 .kommy（flex 縦・中央寄せ）が .msg.kommy にも当たるので、チップと 2 行を持つ吹き出しは通常のブロックに戻す */
.chat .msg.kommy.advice{display:block}
.chat .msg.kommy.advice.warn{background:var(--warn-bg);border-color:var(--warn)}
.chat .msg.kommy.advice.ok{border-color:var(--ok)}
.chat .msg.kommy.advice .chip{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--pink);color:var(--brown);margin:2px 0}
.chat .msg.kommy.advice .l2{color:var(--muted);font-size:.9rem;margin-top:2px}
.chat .turn-context{margin:0 0 6px;padding:0 0 7px;border-bottom:1px solid var(--line)}
.chat .turn-label{font-size:.75rem;font-weight:800;color:var(--muted);line-height:1.2;margin-bottom:5px}
.chat .history-dice{justify-content:flex-start;gap:6px;padding:7px 6px 4px;border-radius:10px}
.chat .history-dice .die{--sz:32px;flex:none;pointer-events:none;transition:none}
.chat .history-dice .die.history-held{transform:translateY(-3px);outline:2px solid #e2a400;outline-offset:1px}
.chat .history-dice .dlabel{min-height:12px;font-size:.58rem;line-height:12px}
.chat .dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#b58a8a;margin:0 2px;animation:blink 1.2s infinite}
.chat .dots span:nth-child(2){animation-delay:.2s}.chat .dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat .topics{display:flex;gap:4px 14px;flex-wrap:wrap;margin:0;padding:6px 12px;border:none;border-top:1px solid var(--line);background:#fff;font-size:.9rem}
.chat .topics label{display:inline-flex;align-items:center;gap:4px;min-height:32px}
.chat .topics input{width:18px;height:18px;accent-color:var(--brown)}
.chat .topics.shake{animation:shake .5s linear;background:var(--warn-bg);outline:2px solid var(--warn);outline-offset:-2px}
@keyframes shake{0%,100%{transform:translateX(0)}10%,50%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(5px)}}
.chat .msg.thinking{display:flex;align-items:center;gap:8px;color:var(--muted)}
.chat .cinput{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);align-items:flex-end;background:#fff}
.chat textarea{flex:1;min-height:44px;max-height:120px;resize:vertical;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.chat .cnt{font-size:.75rem;color:var(--muted);text-align:right;padding:0 12px 6px;background:#fff}
.chat .cnt.over{color:var(--red)}
.chat .info{font-size:.85rem;background:var(--warn-bg);padding:8px 12px;border-bottom:1px solid var(--line)}

/* ---------- misc ---------- */
/* .fanfare と .toast の規則は views/Fanfare.js・views/Toast.js の style へ移した */
.error-screen{align-items:center;justify-content:center;padding:20px;text-align:center;gap:12px}
@media (prefers-reduced-motion:reduce){
  .kommy-svg .p-eyes,.kommy-svg .p-mouth,.kommy-svg .p-brows,.kommy-svg .p-ahoge,.kommy-svg .p-cheeks{transition:none}
  .face[data-expr="happy"] .p-ahoge,.face[data-expr="talk"] .p-mouth{animation:none}
  .die.rolling,.die.free,.kommy-row .portrait .face,.face-title,.topics.shake,.chat-bg .face{animation:none}
  .fanfare.show{animation:none;opacity:1;transform:translate(-50%,-50%);transition:opacity .2s}
  .die,.scorecard tr.flash td{transition:none;animation:none}
  .chat .dots span{animation:none;opacity:.7}
  body,#app{transition:none}
  #scrTitle .face-title.squash{animation:none}
  .heart{animation:none;opacity:1}
}

</style>
</head>

/* 乱数（sfc32）。文字列の種とラベルから、再現できる 0〜1 の系列を作る。
   ブラウザでは window.TDX.rng、Node では module.exports に同じ物を出す。依存なし。 */
(function(root){
'use strict';
var TDX=root.TDX||(root.TDX={});

/* 文字列を 32bit の種へ潰す（xmur3）。 */
function xmur3(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){
    h=Math.imul(h^str.charCodeAt(i),3432918353);
    h=h<<13|h>>>19;
  }
  return function(){
    h=Math.imul(h^(h>>>16),2246822507);
    h=Math.imul(h^(h>>>13),3266489909);
    return (h^=h>>>16)>>>0;
  };
}

/* 32bit の種 4 つから [0,1) の乱数を返す関数を作る（sfc32）。 */
function sfc32(a,b,c,d){
  return function(){
    a>>>=0;
    b>>>=0;
    c>>>=0;
    d>>>=0;
    let t=(a+b)|0;
    a=b^(b>>>9);
    b=(c+(c<<3))|0;
    c=(c<<21|c>>>11);
    d=(d+1)|0;
    t=(t+d)|0;
    c=(c+t)|0;
    return (t>>>0)/4294967296;
  };
}

/* 種とラベル（dice・presentation・chat）ごとに独立した系列を作る。最初の 12 個は捨てる。 */
function makeRng(seed,label){
  const s=xmur3(seed+'|'+label);
  const r=sfc32(s(),s(),s(),s());
  for(let i=0;i<12;i++)r();
  return r;
}

/* 試合の種。ブラウザは window.crypto、Node は globalThis.crypto を使う。 */
function randomSeed(){
  const c=root.crypto||globalThis.crypto;
  const a=new Uint8Array(16);
  c.getRandomValues(a);
  return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');
}

/* 系列から範囲つきの値を取り出す。系列そのものは上の makeRng が作る。 */
function rint(rng,lo,hi){return lo+Math.floor(rng()*(hi-lo+1));}
function rrange(rng,lo,hi){return lo+rng()*(hi-lo);}

const api={xmur3,sfc32,makeRng,randomSeed,rint,rrange};
TDX.rng=api;
if(typeof module!=='undefined'&&module.exports)module.exports=api;
})(typeof window!=='undefined'?window:globalThis);

/* コミーの文言：役の名前・理由コードの定型・褒め言葉と、事実から原則（チップ）と理由文を組み立てる関数。
   DOM も window も触らないので、ブラウザ（window.TDX.text）でも Node（module.exports）でも同じ物を返す。 */
(function(root){
'use strict';
var TDX=root.TDX||(root.TDX={});

/* スコアカードの見出し（狭いので詰める）。 */
const CAT_LABEL=['2','3','4','5','6','フルハウス','Lストレート','ヨット'];
/* 読み上げ・文中で使う役の名前（数字の前後に空白を入れる）。 */
const CAT_SPEECH=['2 の役','3 の役','4 の役','5 の役','6 の役','フルハウス','L ストレート','ヨット'];
/* 遊び方と得点表で出す役の説明。 */
const CAT_DESC=[
  '2 の目の合計','3 の目の合計','4 の目の合計','5 の目の合計','6 の目の合計',
  '同じ目 3 個＋別の同じ目 2 個。出目の合計','1-5 または 2-6。30 点','5 個同じ目。50 点（W＋赤 1×4 は 70 点）'
];
/* 理由コードごとの既定の原則（p）と理由（r）。事実が取れるときは compose* が上書きする。 */
const REASONS={
  KEEP_WILD:{p:'W は必ず残すにゃ',r:'W はどの目にもなれて、70 点ヨットも作れるからにゃ'},
  BONUS_YACHT:{p:'この形は全部残してヨットにするにゃ',r:'W と赤い 1 が 4 個なら 70 点だからにゃ'},
  BONUS_YACHT_DRAW:{p:'70 点ヨットの目も残すにゃ',r:'W と赤い 1 を育てれば 70 点になるからにゃ'},
  MADE_HAND:{p:'完成した役は崩さないにゃ',r:'もう固定点を取れる形だからにゃ'},
  STRAIGHT_CORE:{p:'ストレートの連番を残すにゃ',r:'連番は足りない目のどちら側でも完成するからにゃ'},
  FULL_HOUSE_PAIRS:{p:'二対を残してフルハウスを待つにゃ',r:'残り 1 個の成功面が多いからにゃ'},
  UPPER_RECOVERY:{p:'高い同目をまとめて残すにゃ',r:'上段の不足を 5 や 6 で取り戻しやすいからにゃ'},
  UPPER_PROTECT:{p:'上段を優先して記録するにゃ',r:'55 点のボーナス圏を守るためにゃ'},
  SACRIFICE_LOW:{p:'今回は低い上段へ逃がすにゃ',r:'大きい固定役を 0 点で潰さないためにゃ'},
  LEAD_STABILITY:{p:'勝率が高い残し方を選ぶにゃ',r:'期待点より勝率が大事だからにゃ'},
  TRAIL_UPSIDE:{p:'劣勢では勝率を優先するにゃ',r:'期待点より勝率が大事だからにゃ'},
  TARGET_SCORE:{p:'必要点を超える目を狙うにゃ',r:'最終手番は相手点を上回れば勝ちだからにゃ'},
  FUTURE_VALUE:{p:'今はこの役へ記録するにゃ',r:'その役を残した場合より後の選択肢が強くなるからにゃ'},
  FORCED_ZERO:{p:'0 点を付けるならこの役にするにゃ',r:'他の役の期待値を残せるからにゃ'},
  NEAR_TIE:{p:'どちらでもいい手にゃ',r:'次善との差がほとんどないからにゃ'},
  LAST_CATEGORY:{p:'最後の役へ記録するにゃ',r:'もう記録先は 1 つだけだからにゃ'},
};
/* 正解の KEEP を褒める言葉。 */
const PRAISE=[
  '教主はやっぱり他とはちがうにゃ','その判断で合ってるにゃ','ちゃんと先の役まで見えてるにゃ','いい保持だにゃ',
  'さすが教主にゃ','コミーも同じ手を選ぶにゃ','迷いのない手だにゃ'
];
/* 正解の記録を褒める言葉。 */
const PRAISE_CAT=[
  '教主はやっぱり他とはちがうにゃ','その判断で合ってるにゃ','ちゃんと先の役まで見えてるにゃ','さすが教主にゃ',
  'その記録でいいにゃ','コミーも同じ役に書くにゃ'
];
/* 理由コードが取れないときの受け皿。 */
const KEEP_FUTURE={p:'先の役が強くなる形を残すにゃ',r:'その方が後の役の選択肢が強くなるからにゃ'};
const fmt1=x=>(Math.round(x*10)/10).toString();

/* 理由コード＋事実（残した形・残す役・点差・勝率差・期待点差・余裕 B）から、原則（チップ）と理由文を組み立てる */
function composeKeep(code,F,stem){
  const R=REASONS[code]||REASONS.FUTURE_VALUE;
  if(code==='BONUS_YACHT')return{chip:R.p,reason:`${stem}と、70 点ヨットを確定できるにゃ`};
  if(code==='BONUS_YACHT_DRAW')return{chip:R.p,reason:`${stem}のは、W と赤い 1 を育てれば 70 点ヨットも狙えるからにゃ${keepGap(F)}`};
  if(code==='TARGET_SCORE'){
    const second=F.secondValue==null?'':`。次善は ${fmtPct(F.secondValue)} にゃ`;
    return{chip:R.p,reason:`${stem}の勝率が ${fmtPct(F.bestValue)} で最も高いにゃ${second}`};
  }
  if(code==='KEEP_WILD'){
    const why=F.wildYachtOpen?'W はどの目にもなれて、70 点ヨットも狙える':'W はどの目にもなれる';
    return{chip:R.p,reason:`${stem}のは、${why}からにゃ${keepGap(F)}`};
  }
  if(code==='MADE_HAND'&&F.madeLower>=0)return{chip:R.p,reason:`${stem}と、${CAT_SPEECH[F.madeLower]}へ ${F.madePoints} 点で書けるにゃ${keepGap(F)}`};
  if(F.target){
    const first=`${stem}と、最後は${jn(F.target.name)}へ書く見込みが ${fmtPct(F.target.probability)} で最も高いにゃ`;
    const second=keepGap(F);
    let chip=code==='NEAR_TIE'?REASONS.NEAR_TIE.p:R.p;
    if(code==='FULL_HOUSE_PAIRS')chip=F.pairs.length===2?'二対を残してフルハウスを待つにゃ':F.count>=3?'同じ目 3 個を残して下段役を狙うにゃ':'対を残して下段役を狙うにゃ';
    return{chip,reason:first+second};
  }
  return{chip:code==='NEAR_TIE'?REASONS.NEAR_TIE.p:KEEP_FUTURE.p,reason:`${stem}のが最も有利にゃ`};
}

function composeCat(code,F,stem){
  const R=REASONS[code]||REASONS.FUTURE_VALUE;
  if(code==='LAST_CATEGORY')return{chip:R.p,reason:`最後の役は${jn(F.name)}だけだから、そこへ ${F.points} 点で書くにゃ`};
  if(F.objective==='equity'){
    const second=F.gainPP==null?'':F.gainPP<0.5?'。次善とほぼ同じで、どちらでもいいにゃ':`。次善より勝率が ${fmt1(F.gainPP)} ポイント高いにゃ`;
    return{chip:code==='NEAR_TIE'?REASONS.NEAR_TIE.p:R.p,reason:`${F.name}に書いて${jn(F.leftoverName)}を残すと勝率 ${fmtPct(F.bestValue)} にゃ${second}`};
  }
  const current=F.reward==null?F.points:F.reward,future=F.future==null?0:F.future;
  const first=`${F.name}は、いま ${fmt1(current)} 点＋この先 ${fmt1(future)} 点の見込みにゃ`;
  let second='';
  if(F.gain!=null)second=F.gain<0.3?`。${jn(F.secondName)}とはほぼ同じで、どちらでもいいにゃ`:F.gain<1?`。${jn(F.secondName)}とは僅差で、差は ${fmt1(F.gain)} 点にゃ`:`。次善より ${fmt1(F.gain)} 点高いにゃ`;
  return{chip:code==='NEAR_TIE'?REASONS.NEAR_TIE.p:R.p,reason:first+second};
}

/* 主因の理由文に、第 2 の理由を「〜のも大事にゃ」の形で 1 つだけ足す。 */
function reasonLines(reasons,stem,isKeep,facts){
  const compose=isKeep?composeKeep:composeCat;
  const main=compose(reasons[0],facts,stem);
  let reason=main.reason;
  if(reasons[1]){
    const sub=compose(reasons[1],facts,stem);
    let tail=sub.reason.replace(/^.*?のは、/,'').replace(/（[^（）]*）$/,'');
    /* 置換は 1 段だけ（つなげると前段の結果に後段が当たり「のも大事のも大事にゃ」になる） */
    tail=/だからにゃ$/.test(tail)?tail.replace(/だからにゃ$/,'なのも大事にゃ')
      :/からにゃ$/.test(tail)?tail.replace(/からにゃ$/,'のも大事にゃ')
      :/ためにゃ$/.test(tail)?tail.replace(/ためにゃ$/,'のも大事にゃ')
      :tail.replace(/にゃ$/,'のも大事にゃ');
    reason+=`　${tail}`;
  }
  return{chip:main.chip,reason};
}

/* 確率の表示（アリスのうらないの枡）。小さい値は 1 桁の小数、ほぼ 0 は「≈0%」にする。 */
function fmtPct(p){
  if(p<=0)return '0%';
  if(Math.abs(p-1)<1e-12)return '100%';
  if(p>=0.995)return '99.9%';
  if(p>=0.1)return Math.round(p*100)+'%';
  if(p>=0.0005)return (p*100).toFixed(1)+'%';
  return '≈0%';
}

const api={CAT_LABEL,CAT_SPEECH,CAT_DESC,REASONS,PRAISE,PRAISE_CAT,KEEP_FUTURE};
Object.assign(api,{fmt1,jn,composeKeep,composeCat,reasonLines,fmtPct});

/* ==== js/core/sound-engine.js ==== */
/* 効果音と BGM を鳴らす仕組み（仕様書 21.5）。Web Audio の口は外から渡すので、DOM にも window にも触れない。
   ブラウザでは window.TDX.soundEngine、Node では module.exports に同じ物を出す（tools/test_sound.mjs が偽の口で検査する）。
   鳴らしてよいかは canPlay() に毎回尋ねる。ふたりで対戦以外で鳴らさない決まりを、呼ぶ側の注意に頼らずここで守る。 */
(function(root){
'use strict';
var TDX=root.TDX||(root.TDX={});

var MAX_VOICES=4;          /* 効果音の同時発音の上限。超えたら最も古い音を止める */
var RETRIGGER_SEC=0.05;    /* 同じ効果音をこの間隔より詰めて鳴らさない */
var BGM_FADE_SEC=0.3;      /* BGM を止めるときに絞る時間 */

/*
 options:
   createContext() : AudioContext を作る。作れない環境では null を返すか例外を投げる
   createDecoder() : 復号だけに使う OfflineAudioContext を作る（任意）。自動再生の制限を受けないので、
                     利用者の操作の前でも読み込みを始められる。AudioBuffer はどの文脈でも鳴らせる
   fetchBytes(url) : ArrayBuffer を返す Promise
   manifest        : tools/src/audio/manifest.json と同じ形
   baseUrl         : 音のファイルの置き場（末尾に / を付ける）
   canPlay()       : いま鳴らしてよいか
*/
function create(options){
  var manifest=options.manifest||{sounds:[]};
  var entries={};
  manifest.sounds.forEach(function(e){entries[e.id]=e;});
  var ctx=null;
  var decoderCtx=null;
  var master=null;
  var buffers={};
  var voices=[];        /* {id,source,startedAt} の古い順 */
  var lastStart={};
  var bgm=null;         /* {source,gain} */
  var wantBgm=false;
  var muted=false;
  var loading=null;

  function canPlay(){
    return !!ctx&&options.canPlay();
  }

  /* 利用者の操作の中で同期的に呼ぶ（自動再生の制限を越えるため）。2 回目からは resume だけ。 */
  function unlock(){
    if(!ctx){
      try{ctx=options.createContext();}catch(error){ctx=null;}
      if(!ctx)return false;
      master=ctx.createGain();
      master.gain.value=muted?0:1;
      master.connect(ctx.destination);
    }
    if(ctx.state==='suspended'&&ctx.resume){
      try{ctx.resume().catch(function(){});}catch(error){/* 鳴らないだけで試合は続ける */}
    }
    return true;
  }

  /* 復号に使う文脈。鳴らす文脈があればそれを、なければ復号専用の文脈を使う。 */
  function decoder(){
    if(ctx)return ctx;
    if(!decoderCtx&&options.createDecoder){
      try{decoderCtx=options.createDecoder();}catch(error){decoderCtx=null;}
    }
    return decoderCtx;
  }

  function loadOne(entry){
    var target=decoder();
    return Promise.resolve()
      .then(function(){return options.fetchBytes(options.baseUrl+entry.file);})
      .then(function(bytes){return target.decodeAudioData(bytes);})
      .then(function(buffer){buffers[entry.id]=buffer;})
      .catch(function(){/* 読めない音は鳴らさないだけにする（音は必須データではない） */});
  }

  /* 効果音とジングルを先に、BGM を後に読む。失敗しても reject しない。 */
  function load(){
    if(loading)return loading;
    if(!decoder())return Promise.resolve();
    var first=manifest.sounds.filter(function(e){return e.kind!=='bgm';});
    var later=manifest.sounds.filter(function(e){return e.kind==='bgm';});
    loading=Promise.all(first.map(loadOne))
      .then(function(){return Promise.all(later.map(loadOne));})
      .then(function(){if(wantBgm&&!bgm)beginBgm();});
    return loading;
  }

  function gainNode(value){
    var g=ctx.createGain();
    g.gain.value=value;
    g.connect(master);
    return g;
  }

  /* 効果音・ジングルを 1 つ鳴らす。読込前・鳴らしてはいけないとき・音なしのときは鳴らさず false を返す。 */
  function play(id){
    if(!canPlay()||muted)return false;
    var entry=entries[id];
    var buffer=buffers[id];
    if(!entry||!buffer)return false;
    var now=ctx.currentTime;
    if(lastStart[id]!=null&&now-lastStart[id]<RETRIGGER_SEC)return false;
    lastStart[id]=now;
    while(voices.length>=MAX_VOICES){
      var oldest=voices.shift();
      try{oldest.source.stop();}catch(error){/* もう止まっている */}
    }
    var source=ctx.createBufferSource();
    source.buffer=buffer;
    source.connect(gainNode(entry.gain));
    var voice={id:id,source:source,startedAt:now};
    voices.push(voice);
    source.onended=function(){
      var i=voices.indexOf(voice);
      if(i>=0)voices.splice(i,1);
    };
    source.start(0);
    return true;
  }

  function beginBgm(){
    var entry=manifest.sounds.filter(function(e){return e.kind==='bgm';})[0];
    var buffer=entry&&buffers[entry.id];
    if(!buffer||!canPlay())return;
    var source=ctx.createBufferSource();
    source.buffer=buffer;
    source.loop=true;
    source.loopStart=entry.loop.startSample/manifest.sampleRate;
    source.loopEnd=entry.loop.endSample/manifest.sampleRate;
    var gain=gainNode(entry.gain);
    source.connect(gain);
    source.start(0);
    bgm={source:source,gain:gain};
  }

  /* BGM を頭から鳴らす。まだ読めていなければ、読み終えたときに頭から鳴らす。 */
  function startBgm(){
    if(!canPlay())return false;
    stopBgmNow();
    wantBgm=true;
    beginBgm();
    return !!bgm;
  }

  function stopBgmNow(){
    if(!bgm)return;
    try{bgm.source.stop();}catch(error){/* もう止まっている */}
    bgm=null;
  }

  /* BGM を絞って止める。fadeSec を 0 にすると即座に止める。 */
  function stopBgm(fadeSec){
    wantBgm=false;
    if(!bgm)return;
    var fade=fadeSec==null?BGM_FADE_SEC:fadeSec;
    var current=bgm;
    bgm=null;
    var t=ctx.currentTime;
    try{
      current.gain.gain.setValueAtTime(current.gain.gain.value,t);
      current.gain.gain.linearRampToValueAtTime(0,t+fade);
      current.source.stop(t+fade);
    }catch(error){
      try{current.source.stop();}catch(ignored){/* もう止まっている */}
    }
  }

  /* 全部を止める（タイトルへ戻る・試合を捨てるとき）。 */
  function stopAll(){
    stopBgm(0);
    voices.splice(0).forEach(function(v){
      try{v.source.stop();}catch(error){/* もう止まっている */}
    });
  }

  /* 音なしでも BGM は止めずに進める（戻したとき曲の途中から聞こえる）。 */
  function setMuted(value){
    muted=!!value;
    if(master)master.gain.value=muted?0:1;
  }

  function suspend(){
    if(ctx&&ctx.state==='running'&&ctx.suspend)ctx.suspend().catch(function(){});
  }

  function resume(){
    if(ctx&&ctx.state==='suspended'&&ctx.resume&&options.canPlay())ctx.resume().catch(function(){});
  }

  return {
    unlock:unlock,
    load:load,
    /* 鳴らさずに読み込みだけ始める（タイトルでごきげんになったとき）。 */
    prefetch:load,
    play:play,
    startBgm:startBgm,
    stopBgm:stopBgm,
    stopAll:stopAll,
    setMuted:setMuted,
    isMuted:function(){return muted;},
    isBgmPlaying:function(){return !!bgm;},
    isLoaded:function(id){return !!buffers[id];},
    suspend:suspend,
    resume:resume,
  };
}

var api={create:create,MAX_VOICES:MAX_VOICES,RETRIGGER_SEC:RETRIGGER_SEC};
TDX.soundEngine=api;

if(typeof module!=='undefined'&&module.exports){
  module.exports=api;
}
})(typeof window!=='undefined'?window:globalThis);

/* 対戦モードごとの「誰が手を指すか」と「画面に出す名前」を 1 か所で決める純粋関数（仕様書 21.1）。
   手番の内部キーは user / kommy のままで、ふたりで対戦では user をプレイヤー1、kommy をプレイヤー2 と読む。 */
(function(root){
'use strict';

const TDX=root.TDX||(root.TDX={});
const viewmodel=TDX.viewmodel||(TDX.viewmodel={});

const LABELS={
  normal:{user:'あなた',kommy:'コミー'},
  pvp:{user:'プレイヤー1',kommy:'プレイヤー2'},
  pvpShort:{user:'P1',kommy:'P2'},
};

/* その側の手番を人が操作するか。ふたりで対戦では両方、ほかは user だけ。 */
function isHumanSide(mode,side) {
  return mode==='pvp'||side==='user';
}

/* 画面に出す名前。short は幅の狭い得点表の列見出し用（ふたりで対戦だけ P1／P2 に縮む）。 */
function playerLabel(mode,side,options) {
  const short=!!(options&&options.short);
  const table=mode==='pvp'?(short?LABELS.pvpShort:LABELS.pvp):LABELS.normal;
  return table[side==='kommy'?'kommy':'user'];
}

/* ダイスの上の札と結果の札の文言。指導ありでは出さない（空）。 */
function modeTagText(mode) {
  if(mode==='serious'){
    return 'ガチ対戦';
  }
  if(mode==='pvp'){
    return 'ふたりで対戦';
  }
  return '';
}

const api={isHumanSide,playerLabel,modeTagText};
viewmodel.players=api;

if(typeof module!=='undefined'&&module.exports){
  module.exports=api;
}
})(typeof window!=='undefined'?window:globalThis);

/* ==== js/viewmodel/titleMood.js ==== */
/* タイトルの気分の遷移とボタンの並びを決める純粋関数（仕様書 21.2・21.3）。
   気分は「怒り ⇄ ふつう ⇄ ごきげん」の 3 段で、なでると 1 段上がり、叩くと 1 段下がる。 */
(function(root){
'use strict';

const TDX=root.TDX||(root.TDX={});
const viewmodel=TDX.viewmodel||(TDX.viewmodel={});

const LADDER=['angry','normal','pleased'];

/* gesture は 'pet'（なでる）か 'hit'（叩く）。端ではそのまま留まる。 */
function nextMood(mood,gesture) {
  const index=Math.max(0,LADDER.indexOf(mood));
  const step=gesture==='pet'?1:gesture==='hit'?-1:0;
  return LADDER[Math.min(LADDER.length-1,Math.max(0,index+step))];
}

const BUTTONS={
  normal:{primary:{text:'はじめる',mode:'tutor'},secondary:{text:'ガチ対戦',mode:'serious'},expr:'normal'},
  angry:{primary:{text:'ガチ対戦',mode:'serious'},secondary:{text:'はじめる',mode:'tutor'},expr:'angry'},
  pleased:{primary:{text:'ふたりで対戦',mode:'pvp'},secondary:{text:'はじめる',mode:'tutor'},expr:'happy'},
};

/* 左（主・赤）と右（副・白）のボタン、注記の有無、顔の表情。 */
function titleButtons(mood) {
  const set=BUTTONS[mood]||BUTTONS.normal;
  return {
    primary:set.primary,
    secondary:set.secondary,
    showsSoundNote:set.primary.mode==='pvp',
    expr:set.expr,
  };
}

const api={nextMood,titleButtons};
viewmodel.titleMood=api;

if(typeof module!=='undefined'&&module.exports){
  module.exports=api;
}
})(typeof window!=='undefined'?window:globalThis);
