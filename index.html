/* ==== js/views/chatLog.js ==== */
/* 追記型のチャットログへ、安全に発言要素を足す口を作る。 */
(function(){
'use strict';

function messageElement(kind,text) {
  const message=document.createElement('div');
  message.className='msg '+kind;
  message.textContent=text;
  return message;
}

function lineElement(classes,text) {
  const line=document.createElement('div');
  line.className=classes;
  line.textContent=text;
  return line;
}

function spanElement(classes,text) {
  const span=document.createElement('span');
  span.className=classes;
  span.textContent=text;
  return span;
}

const SVG_NAMESPACE='http://www.w3.org/2000/svg';

function svgElement(name,attributes,text) {
  const element=document.createElementNS(SVG_NAMESPACE,name);
  Object.keys(attributes).forEach(function(attributeName) {
    element.setAttribute(attributeName,attributes[attributeName]);
  });
  if(text){
    element.textContent=text;
  }
  return element;
}

function elfElement() {
  const svg=svgElement('svg',{class:'elf',viewBox:'0 0 40 40','aria-hidden':'true'});
  svg.appendChild(svgElement('path',{
    d:'M20 4 C 26 4 30 10 30 10 C 27 8 24 8 22 9',
    fill:'none',
    stroke:'#fff',
    'stroke-width':'2.4',
    'stroke-linecap':'round',
  }));
  svg.appendChild(svgElement('ellipse',{cx:'20',cy:'24',rx:'13',ry:'11.5',fill:'#fff'}));
  svg.appendChild(svgElement('ellipse',{cx:'20',cy:'24',rx:'11.5',ry:'10',fill:'#dff5d8'}));
  svg.appendChild(svgElement('circle',{cx:'15.5',cy:'23',r:'2.2',fill:'#2b5a33'}));
  svg.appendChild(svgElement('circle',{cx:'24.5',cy:'23',r:'2.2',fill:'#2b5a33'}));
  svg.appendChild(svgElement('path',{
    d:'M16.5 28 q3.5 3 7 0',
    fill:'none',
    stroke:'#2b5a33',
    'stroke-width':'1.6',
    'stroke-linecap':'round',
  }));
  svg.appendChild(svgElement('text',{
    x:'20',
    y:'38',
    'text-anchor':'middle',
    'font-size':'9',
    'font-weight':'900',
    fill:'#fff',
  },'W'));
  return svg;
}

function historyDieElement(dieModel) {
  const slot=document.createElement('div');
  slot.className='dslot';
  slot.setAttribute('aria-hidden','true');
  const die=document.createElement('div');
  die.className='die '+dieModel.classes.join(' ');
  if(dieModel.pressed==='true'){
    die.classList.add('history-held');
  }
  if(dieModel.showsElf){
    die.appendChild(elfElement());
  }else{
    dieModel.pips.forEach(function(active) {
      const pip=document.createElement('div');
      pip.className='pip'+(active?' on':'');
      die.appendChild(pip);
    });
  }
  const label=lineElement('dlabel'+(dieModel.pressed==='true'?' keep':''),dieModel.text);
  slot.appendChild(die);
  slot.appendChild(label);
  return slot;
}

function turnContextElement(entry) {
  const model=TDX.viewmodel.dice.buildHistoryDice(entry.turnContext);
  if(!model){
    return null;
  }
  const context=document.createElement('div');
  context.className='turn-context';
  context.setAttribute('role','img');
  context.setAttribute('aria-label',model.ariaLabel);
  const label=lineElement('turn-label',model.rollText);
  label.setAttribute('aria-hidden','true');
  context.appendChild(label);
  const dice=document.createElement('div');
  dice.className='dice history-dice';
  dice.setAttribute('aria-hidden','true');
  model.dice.forEach(function(dieModel) {
    dice.appendChild(historyDieElement(dieModel));
  });
  context.appendChild(dice);
  return context;
}

function create(options) {
  function logElement() {
    return options.getLogElement();
  }

  function scrollBottom() {
    const log=logElement();
    if(log){
      log.scrollTop=log.scrollHeight;
    }
  }

  function trim() {
    const log=logElement();
    if(!log){
      return;
    }
    while(log.children.length>options.keepCount){
      log.removeChild(log.firstChild);
    }
  }

  function handle(message) {
    return {
      el:message,
      setText:function(text) {
        message.textContent=text;
      },
      addChar:function(character) {
        message.textContent+=character;
        scrollBottom();
      },
      remove:function() {
        message.remove();
      },
    };
  }

  function put(message) {
    const log=logElement();
    if(log){
      log.appendChild(message);
    }
    trim();
    scrollBottom();
    return handle(message);
  }

  function append(kind,text) {
    return put(messageElement(kind,text));
  }

  function thinking(text) {
    const message=messageElement('kommy','');
    const dots=document.createElement('span');
    message.classList.add('thinking');
    dots.className='dots';
    dots.setAttribute('role','img');
    dots.setAttribute('aria-label','考え中');
    for(let i=0;i<3;i++){
      dots.appendChild(document.createElement('span'));
    }
    message.appendChild(dots);
    message.appendChild(spanElement('thinktxt',text));
    return put(message);
  }

  function clear() {
    const log=logElement();
    if(log){
      log.textContent='';
    }
  }

  function addRetry(onRetry) {
    const messageHandle=append('sys','今日はうまく話せないにゃ');
    const button=document.createElement('button');
    button.className='btn-small';
    button.textContent='再試行';
    button.style.marginLeft='8px';
    button.addEventListener('click',function() {
      messageHandle.remove();
      onRetry();
    });
    messageHandle.el.appendChild(button);
  }

  function appendSystem(log,text) {
    const message=messageElement('sys',text);
    log.appendChild(message);
    return message;
  }

  function renderAdvice() {
    const log=logElement();
    if(!log){
      return;
    }
    log.setAttribute('aria-live','off');
    log.textContent='';
    const adviceLog=options.getAdviceLog();
    const mode=options.getMode?options.getMode():'tutor';
    const names=[TDX.viewmodel.players.playerLabel(mode,'user'),TDX.viewmodel.players.playerLabel(mode,'kommy')];
    if(!adviceLog.length){
      appendSystem(log,'まだアドバイスはないにゃ');
    }
    for(let i=0;i<adviceLog.length;i++){
      const entry=adviceLog[i];
      if(entry.kind==='turn'){
        const who=names[entry.who==='kommy'?1:0];
        appendSystem(log,`第 ${entry.round} ラウンド・${who}の手番`);
        continue;
      }
      if(entry.kind==='choice'||entry.kind==='info'){
        appendSystem(log,entry.l1);
        continue;
      }
      if(entry.kind==='result'){
        const userScore=entry.me==null?0:entry.me;
        const kommyScore=entry.ko==null?0:entry.ko;
        appendSystem(log,`試合終了：${names[0]} ${userScore} 点、${names[1]} ${kommyScore} 点`);
      }
      const toneClass=entry.tone==='warn'?' warn':entry.tone==='ok'?' ok':'';
      const message=document.createElement('div');
      message.className='msg kommy advice'+toneClass;
      const context=turnContextElement(entry);
      if(context){
        message.appendChild(context);
      }
      if(entry.chip){
        message.appendChild(spanElement('chip',entry.chip));
      }
      message.appendChild(lineElement('l1',entry.l1));
      if(entry.l2){
        message.appendChild(lineElement('l2',entry.l2));
      }
      log.appendChild(message);
    }
    log.scrollTop=log.scrollHeight;
    log.setAttribute('aria-live','polite');
  }

  return {
    append:append,
    thinking:thinking,
    clear:clear,
    scrollBottom:scrollBottom,
    addRetry:addRetry,
    renderAdvice:renderAdvice,
  };
}

TDX.chatLog={create:create};
})();

/* 画面全体を組み立て、ページ単位のキーボード操作とフォーカス制御を担う。 */
(function(){
'use strict';

const FOCUSABLE='button:not([disabled]),textarea,[tabindex="0"]';

function userInterfaceStore() {
  return TV.useStore('ui');
}

function gameStore() {
  return TV.useStore('game');
}

function directorStore() {
  return TV.useStore('director');
}

function chatStore() {
  return TV.useStore('chat');
}

/* 開いている窓の外へ焦点が出たら、窓の中の最初の押せる物へ戻す。 */
function trapFocus(event) {
  const modalId=userInterfaceStore().topModal();
  if(!modalId){
    return;
  }
  const modal=document.getElementById(modalId);
  if(!modal||modal.contains(event.target)){
    return;
  }
  const firstControl=modal.querySelector('button:not([disabled]),textarea');
  if(firstControl){
    firstControl.focus();
  }
}

/* 窓の中の Tab は輪にする（先頭で Shift＋Tab なら末尾へ、末尾で Tab なら先頭へ）。 */
function wrapTab(event,modalId) {
  const modal=document.getElementById(modalId);
  if(!modal){
    return;
  }
  const focusable=Array.from(modal.querySelectorAll(FOCUSABLE)).filter(function(element) {
    return element.offsetParent!==null;
  });
  if(!focusable.length){
    return;
  }
  const first=focusable[0];
  const last=focusable[focusable.length-1];
  if(event.shiftKey&&document.activeElement===first){
    last.focus();
    event.preventDefault();
    return;
  }
  if(!event.shiftKey&&document.activeElement===last){
    first.focus();
    event.preventDefault();
  }
}

function onKeydown(event) {
  const userInterface=userInterfaceStore();
  const game=gameStore();
  const director=directorStore();
  const targetTag=(event.target.tagName||'').toLowerCase();
  const command=TDX.viewmodel.keyCommand.commandForKey(event,{
    topModal:userInterface.topModal(),
    phase:game.phase,
    active:game.active,
    mode:game.mode,
    canRoll:director.canRoll(),
    canRegister:director.canRegister(),
    targetTag:targetTag,
    targetId:event.target.id||'',
  });
  if(!command){
    return;
  }
  if(command.preventDefault){
    event.preventDefault();
  }

  switch(command.type){
    case 'close-modal':
      userInterface.closeModal(command.modalId);
      break;
    case 'close-chat':
      chatStore().closeChat();
      break;
    case 'chat-send':
      chatStore().chatSend();
      break;
    case 'wrap-tab':
      wrapTab(event,command.modalId);
      break;
    case 'toggle-held':
      director.toggleHeld(command.index);
      break;
    case 'roll':
      director.userRoll();
      break;
    case 'register':
      director.userRegister();
      break;
    case 'skip':
      director.skip();
      break;
  }
}

    TV.watch(function() {
      return userInterface.state.focusReq.seq;
    },function() {
      const selector=userInterface.state.focusReq.sel;
      if(!selector){
        return;
      }
      const element=document.querySelector(selector);
      if(element&&!element.disabled){
        element.focus();
      }
    },{flush:'post'});
    return {};
  },
  mounted:function() {
    document.addEventListener('focusin',trapFocus);
    document.addEventListener('keydown',onKeydown);
    /* ページが隠れたら音を止め、戻ったら鳴らしてよいときだけ再開する（仕様書 21.5） */
    document.addEventListener('visibilitychange',function() {
      const sound=TV.useStore('sound');
      if(document.hidden){
        sound.suspend();
      }else{
        sound.resume();
      }
    });
  },
});

/* ==== js/main.js ==== */
/* 起動。読み込みの最後に来る 1 ファイルで、やることは 3 つだけである。
   根の部品を差し、方策の表を作り、E2E の入口 window.__TDT を各店の関数から組み立てる。
   画面の描き直しはすべて部品が状態から行うので、分割前の renderAll と resize のリスナはもう無い。 */
(function(){
'use strict';

var TD=window.TD;
var GM=window.TDX.game;
var G=TV.useStore('game');
var UI=TV.useStore('ui');
var POLICY=TV.useStore('policy');
var TUT=TV.useStore('tutor');
var DIR=TV.useStore('director');
var CHAT=TV.useStore('chat');

/* 分割前の renderTitle は段階 4 で中身が空になった。__TDT が指しているので名前だけ残す。 */
function renderTitle(){}

function boot(){
  /* 画面も窓もすべて App の中にある。mount はこの 1 回だけである。 */
  TV.mount('App','#app');
  POLICY.solve(function(p){
    UI.state.loading.pct=100*p;
    UI.state.loading.msg=`コミーが最善手の表を作っています… ${Math.round(100*p)}%`;
  }).then(function(r){
    G.phase='title';
    const ev=`EV ${r.root.toFixed(6)} solved in ${r.seconds.toFixed(1)}s`;
    console.info(`strategy ${TD.STRATEGY_ID} rules ${TD.RULES_ID} ${ev}`);
    GM.applyMood();
    /* タイトルの画面は G.phase で出るので、描き直しが済んでから焦点を移す */
    UI.focusLater('#btnStart');
  },function(err){
    G.phase='error';
    UI.state.error.msg='戦略データを準備できませんでした。'+(err&&err.message?'（'+err.message+'）':'');
  });
}

window.__TDT={
  G:G,
  get STRAT(){return POLICY.strat;},
  get adviceLog(){return G.adviceLog;},
  logAdvice:TUT.logAdvice,
  renderAdviceLog:CHAT.renderAdviceLog,
  newMatch:GM.newMatch,
